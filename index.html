<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HUFT CRM Strategy</title>
<!--
  HUFT CRM Strategy Engine — BUILD STRAT-2.0.0
  Single-file React (UMD + Babel classic runtime). CRM Creative look & feel, left nav.
  Flow: Dashboard -> Catalog -> Sales x Performance -> Priorities -> Strategy -> Calendar (guided brief -> Creative Engine).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
/* on-page error reporter: show errors instead of a blank page */
(function(){
  function show(msg){
    var r=document.getElementById('root');
    var html='<div style="font:13px/1.6 ui-monospace,Menlo,monospace;color:#8a1020;background:#fff4f4;border:1px solid #f2c2c2;padding:16px 18px;margin:16px;border-radius:10px;white-space:pre-wrap;word-break:break-word"><b>App error — this is why the screen was blank:</b>\n\n'+String(msg)+'</div>';
    if(r){ r.innerHTML=html; } else { document.addEventListener('DOMContentLoaded',function(){var rr=document.getElementById('root'); if(rr) rr.innerHTML=html;}); }
  }
  window.addEventListener('error',function(e){ show((e.message||'Error')+(e.filename?('\n'+String(e.filename).split('/').pop()+':'+e.lineno+':'+e.colno):'')+(e.error&&e.error.stack?('\n\n'+e.error.stack):'')); });
  window.addEventListener('unhandledrejection',function(e){ show('Unhandled promise rejection:\n'+((e.reason&&e.reason.stack)||e.reason)); });
  var _ce=console.error;
  console.error=function(){ try{ var r=document.getElementById('root'); if(r && !r.childElementCount){ var m=Array.prototype.map.call(arguments,function(a){return (a&&a.stack)||(typeof a==='object'?JSON.stringify(a):String(a));}).join(' '); if(m) show(m); } }catch(_){} return _ce.apply(console,arguments); };
})();
</script>
<style>
  :root{
    --orange:#FF6D1F; --orange-soft:#FFF1E8; --orange-line:#FFD9C2; --orange-deep:#C4531A;
    --teal:#0E8C82; --teal-soft:#E4F4F2;
    --ink:#1A1512; --muted:#8B817A; --faint:#B7ADA4;
    --paper:#FAF6EF; --card:#FFFFFF; --line:#ECE4DA; --line-2:#F4EEE6;
    --good:#1E9E6A; --good-soft:#E6F5EE; --warn:#C77D12; --warn-soft:#FBF0DE; --bad:#D14343; --bad-soft:#FBE9E9;
    --shadow:0 1px 2px rgba(26,21,18,.05),0 6px 20px rgba(26,21,18,.05);
    --r:14px; --r-sm:10px; --side:236px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--orange-line)}
  code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:.9em}

  /* ---- shell ---- */
  .app{display:flex;min-height:100vh}
  .side{width:var(--side);flex-shrink:0;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
  .logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:800;letter-spacing:-.02em;font-size:15px}
  .paw{width:30px;height:30px;border-radius:9px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(255,109,31,.35)}
  .logo small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:-1px}
  .nav2{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav2 .sec{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
  .nav2 button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:9px 10px;border-radius:9px;text-align:left;width:100%;position:relative}
  .nav2 button:hover{background:var(--line-2);color:var(--ink)}
  .nav2 button.on{background:var(--orange-soft);color:var(--orange-deep)}
  .nav2 button.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--orange);border-radius:3px}
  .nav2 svg{width:17px;height:17px;flex-shrink:0}
  .side-foot{margin-top:auto;padding:10px 8px 2px;font-size:10.5px;color:var(--faint)}
  .badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:600;letter-spacing:.02em}
  .badge .live{width:6px;height:6px;border-radius:50%;background:var(--faint)}

  .main{flex:1;min-width:0;padding:24px 28px 80px;max-width:1180px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px}
  h3{font-size:14px;font-weight:700;margin:0}

  /* ---- period picker ---- */
  .periodbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;color:var(--ink);position:relative}
  .periodbtn svg{width:15px;height:15px;color:var(--orange)}
  .pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(26,21,18,.14);padding:6px;z-index:50;min-width:200px}
  .pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .pop button:hover{background:var(--line-2);color:var(--ink)}
  .pop button.on{background:var(--orange-soft);color:var(--orange-deep)}
  .pop .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 11px 3px}

  /* ---- cards / grid ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .grid{display:grid;gap:14px}
  .row{display:flex;gap:14px;flex-wrap:wrap}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--line-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .chip.dog{background:var(--orange-soft);color:var(--orange-deep);border-color:var(--orange-line)}
  .chip.cat{background:var(--teal-soft);color:var(--teal);border-color:#BFE6E1}
  .chip.life{background:#F0ECFB;color:#6B54B8;border-color:#DED3F5}
  .chip.food{background:#EAF3EC;color:#2E7D4F;border-color:#CFE6D6}
  .chip.treats{background:#FBF0DE;color:#9A6410;border-color:#F0DDBB}
  .chip.offer{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.p3{background:#EEF1F4;color:#556;border-color:#DDE3E9}
  .chip.mov{background:var(--good-soft);color:var(--good);border-color:#C6E9D6}
  .chip.wa{background:#E7F3EC;color:#1c7a4f;border-color:#C9E7D5}
  .chip.pn{background:#EAF0FB;color:#3159a8;border-color:#CFDCF3}
  .chip.em{background:#FBEFE6;color:#a3561f;border-color:#F2D8C2}

  .delta{font-weight:700;font-size:12.5px}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .big{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:6px 0 3px}
  .kpi .cmp{font-size:11.5px;color:var(--faint);font-weight:500}

  .barrow{display:flex;align-items:center;gap:12px;margin:9px 0}
  .barrow .nm{width:150px;font-size:13px;font-weight:600;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{flex:1;height:22px;background:var(--line-2);border-radius:7px;overflow:hidden}
  .barfill{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700}
  .barval{width:96px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0}
  .split-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .split-bar div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .target-note{font-size:12px;color:var(--muted);margin-top:8px}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  th.r,td.r{text-align:right}
  tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--orange-soft)}
  .rank{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
  .verdict{font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:20px}
  .v-good{background:var(--good-soft);color:var(--good)} .v-watch{background:var(--warn-soft);color:var(--warn)} .v-bad{background:var(--bad-soft);color:var(--bad)}

  /* ---- tiles ---- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(26,21,18,.10)}
  .thumb{height:104px;display:grid;place-items:center;font-weight:800;font-size:28px;color:#fff;position:relative}
  .thumb .own{position:absolute;top:8px;right:8px}
  .tile-b{padding:11px 12px 13px}
  .tile-b .nm{font-weight:700;font-size:13px;line-height:1.25}
  .tile-b .br{color:var(--muted);font-size:11px;margin-top:1px}
  .tile-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .brandhdr{display:flex;align-items:baseline;gap:10px;margin:22px 0 11px}
  .brandhdr .cnt{color:var(--faint);font-size:12px;font-weight:600}

  /* ---- drawer / modal ---- */
  .scrim{position:fixed;inset:0;background:rgba(26,21,18,.36);z-index:60;display:flex;justify-content:flex-end}
  .scrim.center{justify-content:center;align-items:flex-start;padding:40px 20px;overflow:auto}
  .drawer{width:min(460px,94vw);background:var(--paper);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .modal{width:min(860px,96vw);background:var(--paper);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .modal-top{padding:18px 20px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}
  .x{width:32px;height:32px;border-radius:9px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:700}
  .drawer .x{background:rgba(0,0,0,.06);color:var(--ink)}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .kv .k{color:var(--muted)} .kv .v{font-weight:600;text-align:right}

  /* ---- buttons / inputs ---- */
  .btn{border:0;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px}
  .btn:disabled{background:var(--faint);cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.dark{background:var(--ink)}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .inp{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-size:13px;width:100%;color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--orange-line)}
  .search{width:230px}
  .toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);user-select:none;cursor:pointer}
  .toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:13.5px}
  .note{font-size:12px;color:var(--muted);line-height:1.5}

  /* ---- guided brief ---- */
  .field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:12px}
  .field .q{font-size:14px;font-weight:700}
  .field .q .req{color:var(--orange);margin-left:2px}
  .field .q .opt{color:var(--faint);font-weight:600;font-size:11.5px;margin-left:6px}
  .field .help{font-size:12px;color:var(--muted);margin:3px 0 11px;line-height:1.45}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:20px}
  .opt:hover{border-color:var(--orange-line)}
  .opt.on{background:var(--orange);color:#fff;border-color:var(--orange)}
  .opt.more{color:var(--muted);border-style:dashed}
  .brief-free{margin-top:9px}
  .briefbar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--paper) 70%,transparent);padding:14px 2px 4px;display:flex;align-items:center;gap:10px}
  .req-note{font-size:12px;color:var(--muted);font-weight:600}

  /* ---- calendar ---- */
  .calwrap{display:block}
  .calwrap.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:4px 0}
  .day{min-height:96px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--card);font-size:11px;transition:border-color .1s}
  .day.empty{background:transparent;border:0}
  .day.off{background:var(--line-2)}
  .day.drop{border-color:var(--orange);border-style:dashed}
  .day .dn{font-weight:700;color:var(--muted);font-size:11px;margin-bottom:4px}
  .send{font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:6px;margin-bottom:3px;color:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:4px;align-items:center}
  .send:hover{filter:brightness(1.06)}
  .send.on{outline:2px solid var(--ink);outline-offset:1px}
  .send.wa{background:#25946b} .send.pn{background:#3b6fd4} .send.em{background:#b6602a}
  .send .b{font-size:8px;opacity:.85}
  .split .cal .day{min-height:74px}
  .split .send{font-size:9.5px}
  .brief-side{max-height:calc(100vh - 120px);overflow:auto;padding-right:2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:14px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

  .drop-zone{border:2px dashed var(--orange-line);background:var(--orange-soft);border-radius:var(--r);padding:34px;text-align:center;cursor:pointer}
  .drop-zone:hover{background:#FFE9DA}
  .goal-inp{width:120px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:90}
  .focus-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
  .check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
  .check.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .reason{font-size:12px;color:var(--muted);background:var(--line-2);border-radius:8px;padding:8px 11px;margin-top:8px;line-height:1.45}

  @media(max-width:820px){
    .side{position:fixed;z-index:70;transform:translateX(-100%);transition:transform .2s} .side.open{transform:none}
    .main{padding:18px 14px 70px} .calwrap.split{grid-template-columns:1fr}
    .menu-btn{display:inline-grid} .barrow .nm{width:100px}
  }
  .menu-btn{display:none;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:14px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;
const BUILD = "STRAT-2.1.1";
const USE_MOCK = true;                       // flip to false to pull live from the sales-api
const API_BASE = "http://localhost:8787";    // sales-api origin (Node/Express -> MySQL)

/* ============================ CATALOG (real HUFT tree, priority order) ============================ */
// species: Dog|Cat|Lifestyle ; category: Food|Treats|Lifestyle ; owner: HUFT|3P
// cohorts from the real brief grid: {n, target, hook, offer}
const C = (n,target,hook,offer)=>({n,target,hook,offer});

const CATALOG = [
  // ---- DOG · Sara's ----
  {id:"swf-food", name:"SWF Food", brand:"Sara's", species:"Dog", category:"Food", owner:"HUFT", price:1299, sku:"SWF-FOOD", tags:["fresh","dog","premium"], cohorts:[

  {id:"sara-probiotic", name:"Sara's Probiotic Chews", brand:"Sara's", species:"Dog", category:"Treats", owner:"HUFT", price:699, sku:"SARA-PROBIO", tags:["gut","supplement","dog"], cohorts:[

  {id:"sara-boosters", name:"Sara's Boosters", brand:"Sara's", species:"Dog", category:"Food", owner:"HUFT", price:599, sku:"SARA-BOOST", tags:["topper","dog"], cohorts:[]},
  {id:"sara-treats", name:"Sara's Treats", brand:"Sara's", species:"Dog", category:"Treats", owner:"HUFT", price:349, sku:"SARA-TREAT", tags:["single-ingredient","dog"], cohorts:[

  {id:"sara-gravy", name:"Sara's Gravy", brand:"Sara's", species:"Dog", category:"Food", owner:"HUFT", price:399, sku:"SARA-GRAVY", tags:["gravy","dog"], cohorts:[]},

  // ---- DOG · Hearty ----
  {id:"hearty-dry", name:"Hearty Dry", brand:"Hearty", species:"Dog", category:"Food", owner:"HUFT", price:1199, sku:"HEART-DRY", tags:["kibble","baked","dog"], cohorts:[
    C(1,"Premium import kibble buyers (Royal Canin, Farmina, Acana, Orijen)","Baked, not extruded; x% protein, grain free",true),

  {id:"hearty-gravy", name:"Hearty Gravy", brand:"Hearty", species:"Dog", category:"Food", owner:"HUFT", price:429, sku:"HEART-GRAVY", tags:["gravy","dog"], cohorts:[

function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)}
function rnd(str){return (seed(str)%10000)/10000}

// deterministic mock sales per product for the three windows
function mockSales(){
  return CATALOG.map(p=>{
    const catBase = p.category==="Food"?1400 : p.category==="Treats"?800 : 500;
    const own = p.owner==="3P"?0.5:1;
    const emptyPenalty = p.cohorts.length? 1 : 0.55; // un-briefed SKUs sell softer in mock
    const unitsLM = Math.round((catBase*(0.4+rnd(p.id)*1.4))*own*emptyPenalty);
    const unitsLY = Math.round(unitsLM*(0.68+rnd(p.id+"ly")*0.30));
    const unitsTQ = Math.round(unitsLM*(2.7+rnd(p.id+"tq")*0.7));
    const d2cShare = 0.55+rnd(p.id+"ch")*0.30;
    return {...p,
      lm:{units:unitsLM, rev:unitsLM*p.price},
      ly:{units:unitsLY, rev:unitsLY*p.price},
      tq:{units:unitsTQ, rev:unitsTQ*p.price},
      d2cShare};
  });
}

async function rpc(name){
  const r = await fetch(`${API_BASE}/rest/v1/rpc/${name}`);
  if(!r.ok) throw new Error(name+" "+r.status);
  return r.json();
}
// API returns per-node {id, lm:{units,rev}, ly:{...}, tq:{...}, d2cShare?}; join to CATALOG for name/brand/cohorts.
async function fetchSales(){
  const rows = await rpc("strategy_sales_by_product");
  const byId = {}; rows.forEach(x=>byId[x.id]=x);
  return CATALOG.map(p=>{
    const s = byId[p.id]||{};
    const z = {units:0,rev:0};
    return {...p, lm:s.lm||z, ly:s.ly||z, tq:s.tq||z, d2cShare:(s.d2cShare!=null?s.d2cShare:0.6)};
  });
}
async function fetchAffinity(){
  const rows = await rpc("strategy_combo_affinity"); // [{items:[id..], name, size, lift, push, why}]
  return rows;
}
async function loadData(){
  if(USE_MOCK) return {ok:true};

  SALES = sales; AFFINITY = aff;                     // ASSETS stays CleverTap-CSV-fed (Upload tab)
  return {ok:true};
}

function inferObjective(t){t=(t||"").toLowerCase();
  if(t.includes("lapsed")||t.includes("win")||t.includes("not purchased")||t.includes("not bought"))return "Win-back / Reactivation";
  if(t.includes("non-")||t.includes("haven't")||t.includes("first")||t.includes("new")||t.includes("upgrader")||t.includes("economy"))return "Conversion (first purchase)";
  if(t.includes("existing")||t.includes("attach")||t.includes("cross")||t.includes("buyers"))return "Upsell / Cross-sell";
  return "Retention / Loyalty";
}

  if(t.includes("lapsed"))return "Lapsed 60–90 days";

  if(t.includes("puppy")||t.includes("new"))return "New pet just adopted";

function inferPillar(objective,category){
  const o=(objective||"").toLowerCase();
  if(o.includes("win-back")||o.includes("retention"))return "Importance";
  if(o.includes("conversion")||o.includes("first"))return "Trust";
  if(o.includes("education"))return "Edutainment";
  if(o.includes("seasonal"))return "Discovery";
  return category==="Treats"?"Edutainment":"Importance";
}

  const totC=SALES.reduce((a,r)=>({rev:a.rev+P(r,cmp).rev,units:a.units+P(r,cmp).units}),{rev:0,units:0});
  const orders=Math.round(tot.units/2.3), ordersC=Math.round(totC.units/2.3);
  const aov=tot.rev/Math.max(1,orders);
  const dRev=pct(tot.rev,totC.rev), dU=pct(tot.units,totC.units), dO=pct(orders,ordersC);
  const dogPct=Math.round(SALES.filter(r=>r.species==="Dog").reduce((a,r)=>a+P(r,period).rev,0)/tot.rev*100);
  const catPct=Math.round(SALES.filter(r=>r.species==="Cat").reduce((a,r)=>a+P(r,period).rev,0)/tot.rev*100);
  const d2c=Math.round(SALES.reduce((a,r)=>a+P(r,period).rev*r.d2cShare,0)/tot.rev*100);

  const assets=ASSETS;
  // asset performance against sales: revenue attributed to CRM vs total
  const crmRev=assets.reduce((a,x)=>a+x.rev,0);
  const crmShare=Math.round(crmRev/tot.rev*100);
  // top performing audiences (group assets by audience)
  const byAud={};
  assets.forEach(a=>{const p=CATALOG.find(x=>x.id===a.pid)||{};const key=(p.cohorts&&p.cohorts[a.cohortN-1]?p.cohorts[a.cohortN-1].target:a.name)||a.name;
    byAud[key]=byAud[key]||{aud:key,rev:0,conv:0,n:0,sent:0}; byAud[key].rev+=a.rev; byAud[key].conv+=a.conv; byAud[key].sent+=a.sent; byAud[key].n++;});
  const topAud=Object.values(byAud).map(x=>({...x,conv:x.conv/x.n})).sort((a,b)=>b.rev-a.rev).slice(0,6);

  const Kpi=({lab,val,d})=><div className="card pad kpi"><div className="lab">{lab}</div><div className="big">{val}</div><div className="cmp"><span className={"delta "+d.cls}>{d.t}</span> vs {cmpLabel}</div></div>;
  return <div>

function DrillModal({r,onClose}){
  const mtd={units:Math.round(r.lm.units*0.42),rev:Math.round(r.lm.rev*0.42)};

  const as=ASSETS.filter(a=>a.pid===r.id);
  const good=as.filter(a=>a.verdict==="good"), bad=as.filter(a=>a.verdict==="bad");

  const prod=CATALOG.find(x=>x.id===r.id)||r;
  return <div className="scrim center" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-top"><div><div className="eyebrow" style={{color:"#ffd9c2"}}>Sales × performance</div><b style={{fontSize:17}}>{r.name}</b></div><button className="x" onClick={onClose}>✕</button></div>
    <div className="pad" style={{background:"var(--paper)"}}>

      <div className="card"><div style={{padding:6}}><table>
        <thead><tr><th>Period</th><th className="r">Units</th><th className="r">Revenue</th></tr></thead>

      </table></div></div>
      <div className="card pad" style={{marginTop:12,borderLeft:"4px solid "+(helped?"var(--good)":as.length?"var(--warn)":"var(--faint)")}}>
        <div className="eyebrow">Did the CRM push help?</div>
        <h3 style={{margin:"5px 0 6px"}}>{as.length===0?"No CRM push ran — opportunity":helped?"Yes — CRM push lifted this SKU":"Mixed — push under-delivered"}</h3>
        <div className="note">{as.length===0
          ? "This product sold on organic demand alone. A targeted push to a lapsed or cross-sell cohort is untapped upside."
          : `${as.length} send${as.length>1?"s":""} ran. ${good.length} worked, ${bad.length} underperformed. Revenue is ${lift>=0?"up "+lift+"%":"down "+Math.abs(lift)+"%"} vs the same month last year — ${helped?"consistent with the push driving incremental volume.":"the push isn't clearly moving the needle; rework the hook or cohort."}`}</div>
      </div>
      <div className="row" style={{marginTop:12,alignItems:"stretch"}}>
        <div className="card pad" style={{flex:"1 1 260px"}}>
          <div className="eyebrow" style={{color:"var(--good)"}}>What worked · cohorts</div>
          {good.length===0&&<div className="note" style={{marginTop:6}}>No standout cohort yet.</div>}
          {good.map(a=><div className="reason" key={a.id} style={{marginTop:8}}><b>Cohort {a.cohortN}</b> · {a.ch}/{a.aud} — CTR {a.ctr.toFixed(1)}%, conv {a.conv.toFixed(1)}%<br/>{a.hook}</div>)}
        </div>
        <div className="card pad" style={{flex:"1 1 260px"}}>
          <div className="eyebrow" style={{color:"var(--bad)"}}>What didn't · cohorts</div>
          {bad.length===0&&<div className="note" style={{marginTop:6}}>Nothing flagged failing.</div>}
          {bad.map(a=><div className="reason" key={a.id} style={{marginTop:8}}><b>Cohort {a.cohortN}</b> · {a.ch}/{a.aud} — CTR {a.ctr.toFixed(1)}%, conv {a.conv.toFixed(1)}%<br/>{a.offer?"offer didn't convert — try a new angle":"add an offer or switch cohort"}</div>)}
        </div>
      </div>
    </div>
  </div></div>;
}

/* ============================ PRIORITIES ============================ */
function halfLabel(fp){return MONTHS[fp.month]+" "+fp.year+" · "+(fp.half==="H1"?"1st half (1–15)":"2nd half (16–"+daysInMonth(fp.year,fp.month)+")")}
function Priorities({catalog,focus,setFocus,fp,setFp}){
  const [popOpen,setPop]=useState(false);
  const ranked=[...SALES].filter(r=>r.owner==="HUFT"&&r.cohorts.length>0)
    .map(r=>({...r,score:Math.log10(P(r,"lm").rev+10)*(r.category==="Food"?3:r.category==="Treats"?2:1)*(r.species==="Dog"?0.6:0.4)}))
    .sort((a,b)=>b.score-a.score).slice(0,14);
  const isOn=id=>focus.some(f=>f.pid===id);
  const goalOf=id=>{const f=focus.find(x=>x.pid===id);return f?f.goal:""};
  function toggle(id){ if(isOn(id)) setFocus(focus.filter(f=>f.pid!==id)); else setFocus([...focus,{pid:id,goal:Math.round(P(SALES.find(s=>s.id===id),"lm").rev*1.15/1000)*1000}]); }
  function setGoal(id,v){ setFocus(focus.map(f=>f.pid===id?{...f,goal:+v||0}:f)); }
  const totalGoal=focus.reduce((a,f)=>a+(f.goal||0),0);
  return <div>
    <div className="page-head">
      <div><h1>Set priorities</h1><p className="sub">Pick the SKUs in focus for this period and set a revenue goal for each.</p></div>

          <div className="lab">Month</div>
          <div className="row" style={{gap:4,padding:"0 6px 6px"}}>
            <button className="btn ghost sm" onClick={()=>setFp({...fp,month:(fp.month+11)%12,year:fp.month===0?fp.year-1:fp.year})}>‹</button>
            <div style={{flex:1,textAlign:"center",fontWeight:700,alignSelf:"center"}}>{MONTHS[fp.month].slice(0,3)} {fp.year}</div>
            <button className="btn ghost sm" onClick={()=>setFp({...fp,month:(fp.month+1)%12,year:fp.month===11?fp.year+1:fp.year})}>›</button>
          </div>
          <div className="lab">Fortnight</div>
          <button className={fp.half==="H1"?"on":""} onClick={()=>setFp({...fp,half:"H1"})}>1st half (1–15)</button>
          <button className={fp.half==="H2"?"on":""} onClick={()=>setFp({...fp,half:"H2"})}>2nd half (16–end)</button>
        </div>}
      </div>
    </div>
    <div className="card pad" style={{marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div><div className="eyebrow">Focus set</div><h2 style={{marginTop:3}}>{focus.length} products · {halfLabel(fp)}</h2></div>
      <div style={{textAlign:"right"}}><div className="eyebrow">Combined revenue goal</div><div style={{fontSize:22,fontWeight:800}}>{INR(totalGoal)}</div></div>
    </div>
    <div className="eyebrow" style={{marginBottom:10}}>Suggested focus (ranked by revenue × priority)</div>
    {ranked.map(r=><div className="focus-row" key={r.id}>
      <div className={"check "+(isOn(r.id)?"on":"")} onClick={()=>toggle(r.id)}>{isOn(r.id)?"✓":""}</div>
      <div style={{flex:1,minWidth:0}}><b style={{fontSize:13.5}}>{r.name}</b> {speciesChip(r.species)} {catChip(r.category)}<div className="note">Last month {K(P(r,"lm").rev)} · {r.cohorts.length} cohorts ready</div></div>
      <div style={{textAlign:"right"}}><div className="note" style={{marginBottom:2}}>Revenue goal</div>
        <input className="inp goal-inp" type="number" disabled={!isOn(r.id)} value={goalOf(r.id)} onChange={e=>setGoal(r.id,e.target.value)} placeholder="₹"/></div>
    </div>)}
  </div>;
}

/* ============================ STRATEGY ============================ */
function seasonalNote(month){
  const m=["New-year reset & resolutions","Winter coat & joint care","Spring shedding & grooming","Summer hydration & cooling","Pre-monsoon stock-up","Monsoon paw & skin care","Monsoon indoor enrichment","Independence-day & festive ramp","Festive gifting build-up","Diwali peak — gifting & premiumisation","Post-festive winter feeding","Year-end loyalty & clearance"];
  return m[month];
}
function Strategy({catalog,focus,choices,setChoices,fp,locked,setLocked,onLock,caps,setCaps}){
  const items=focus.map(f=>catalog.find(p=>p.id===f.pid)).filter(Boolean);
  function suggestAll(){
    const c={}; items.forEach(p=>{
      const ly=P(SALES.find(s=>s.id===p.id)||{},"ly");
      // contextual: prefer offer-led cohort in festive months, else cohort 1
      const festive=[8,9,7].includes(fp.month);
      const idx = festive ? (p.cohorts.findIndex(x=>x.offer)) : 0;
      c[p.id]= (idx>=0?p.cohorts[idx].n:(p.cohorts[0]?p.cohorts[0].n:1));
    });
    setChoices(c);
  }
  const setC=(pid,n)=>setChoices({...choices,[pid]:n});
  return <div>
    <div className="page-head">
      <div><h1>Strategy</h1><p className="sub">Lock the cohort to push per focus SKU, then generate the calendar. Suggestions use last year's same period + where we are in the year.</p></div>
      <button className="btn ghost" onClick={suggestAll}>✨ Suggest from last year</button>
    </div>
    <div className="card pad" style={{marginBottom:16,background:"linear-gradient(135deg,#FFF6EF,#fff)"}}>
      <div className="eyebrow">Contextual read · {MONTHS[fp.month]} {fp.year}</div>
      <h2 style={{marginTop:4}}>{seasonalNote(fp.month)}</h2>
      <div className="note" style={{marginTop:4}}>Default suggestions lean {[8,9,7].includes(fp.month)?"offer-led (festive window)":"brand/product-story led"} and prioritise SKUs that over-indexed this month last year.</div>
    </div>
    {items.length===0&&<div className="empty">No focus SKUs yet — set priorities first.</div>}
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))"}}>

/* ---- talking-point intelligence ---- */
function hookEvidence(pid,cohortN){
  const hits=ASSETS.filter(a=>a.pid===pid&&a.cohortN===cohortN);
  if(!hits.length)return null;
  const best=[...hits].sort((a,b)=>b.conv-a.conv)[0];
  return {worked:hits.some(a=>a.verdict==="good"),failed:hits.every(a=>a.verdict==="bad"),best,n:hits.length};
}
const ANGLE_LIB={
  Food:["Replenishment nudge — time to restock the bowl, sized to their last order","Ingredient proof — show the label, name the meat %","Vet / nutritionist endorsement angle","Real-parent story — energy & coat change after the switch"],
  Treats:["Training-moment angle — reward without guilt","Single-ingredient honesty — read the back of our pack vs theirs","Combo / variety pack — a new texture to try this week","Weekend enrichment ritual — the long-chew wind-down"],
  Lifestyle:["Season-fit angle — weather-led need, right now","Complete-the-routine bundle alongside their food order"]
};
function suggestAltHook(p,cohort,salt){
  if(!salt){ for(const c of (p.cohorts||[])){ if(c.n!==cohort.n){ const ev=hookEvidence(p.id,c.n); if(ev&&ev.worked) return {hook:c.hook,src:`cohort ${c.n}'s hook is already proven on this product (conv ${ev.best.conv.toFixed(1)}%)`}; } } }
  const lib=ANGLE_LIB[p.category]||ANGLE_LIB.Lifestyle;
  const idx=(seed(p.id+(cohort.n||1))+(salt||0))%lib.length;
  return {hook:lib[idx],src:"new angle from the "+p.category+" playbook — untested, run as an A/B"};
}
function findConflicts(assets,catalog){
  const out=[],byDay={};
  assets.forEach(a=>{byDay[a.date]=byDay[a.date]||[];byDay[a.date].push(a)});
  Object.entries(byDay).forEach(([d,list])=>{
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const A=catalog.find(x=>x.id===list[i].pid)||{},B=catalog.find(x=>x.id===list[j].pid)||{};
      if(!A.species||A.species!==B.species)continue;
      if(A.category!==B.category)out.push({date:d,msg:`${fmtDate(d)}: ${A.name} (${A.category}) and ${B.name} (${B.category}) both talk to ${A.species} parents — competing for the same wallet on the same day`});
      else if(list[i].pid!==list[j].pid)out.push({date:d,msg:`${fmtDate(d)}: two ${A.category} pushes to ${A.species} parents (${A.name} vs ${B.name}) — pick one`});
    }
  });
  return out;
}
const SEQ=[
  {k:"story",label:"Open the story",why:"First touch — establish the talking point before any ask"},
  {k:"proof",label:"Prove it",why:"Second touch — evidence lands while the opener is still in recall (≤3 days)"},
  {k:"close",label:"Close / nudge",why:"Third touch — the ask only lands after story + proof have run"}
];
function buildCalendar(focus,choices,catalog,fp,caps){
  caps=caps||{WA:30,PN:2,Email:3};
  const end=daysInMonth(fp.year,fp.month);
  const first=fp.half==="H1"?1:16, last=fp.half==="H1"?15:end, span=last-first+1;
  const catW={Food:0,Treats:1,Lifestyle:2};
  const items=focus.map(f=>({f,p:catalog.find(x=>x.id===f.pid)}))
    .filter(x=>x.p&&choices[x.f.pid]!=="skip")
    .sort((a,b)=>(catW[a.p.category]-catW[b.p.category])||((b.f.goal||0)-(a.f.goal||0)));
  const used={WA:0,PN:0,Email:0}, out=[];
  const catStory={Food:"the bowl conversation leads the fortnight",Treats:"the reward story only starts once the bowl conversation has run",Lifestyle:"lifestyle rides the tail of the fortnight, never against a meal or treat push"};
  function windowFor(cat){
    if(cat==="Food")return [first,first+Math.max(3,Math.floor(span*0.55))-1];
    if(cat==="Treats")return [first+Math.floor(span*0.4),last];
    return [Math.max(first,last-3),last];
  }
  const dayLoad={},speciesCatDay={},catIdx={};
  function place(want,species,category,w0,w1){
    for(let off=0;off<=span;off++){
      const cands=off===0?[want]:[want+off,want-off];
      for(const cand of cands){
        if(cand<w0||cand>w1)continue;
        const key=species+"|"+cand;
        if(speciesCatDay[key]&&speciesCatDay[key]!==category)continue;
        if((dayLoad[cand]||0)>=3)continue;
        speciesCatDay[key]=category;dayLoad[cand]=(dayLoad[cand]||0)+1;
        return cand;
      }
    }
    return Math.min(Math.max(want,w0),w1);
  }
  items.forEach((it,idx)=>{
    const {f,p}=it;
    const cN=choices[f.pid];
    const cohort=p.cohorts[(cN||1)-1]||p.cohorts[0]||{n:cN||1,target:"—",hook:"—",offer:false};
    const ev=hookEvidence(p.id,cohort.n||1);
    let hook=cohort.hook, altUsed=false;
    let hookSrc=ev?(ev.worked?`Proven talking point — conv ${ev.best.conv.toFixed(1)}% / CTR ${ev.best.ctr.toFixed(1)}% when it last ran`:`Ran before with mixed results (conv ${ev.best.conv.toFixed(1)}%) — kept, watch it`):"Untested talking point from the cohort brief — first outing";
    if(ev&&ev.failed){const alt=suggestAltHook(p,cohort);hook=alt.hook;altUsed=true;hookSrc=`Old hook failed when it ran (conv ${ev.best.conv.toFixed(1)}%) — replaced: ${alt.src}`;}
    const [w0,w1]=windowFor(p.category);
    const ck=p.category+p.species; const ci=(catIdx[ck]=catIdx[ck]||0); catIdx[ck]++;
    const anchor=w0+(ci*2)%Math.max(1,w1-w0);
    const isTop=idx<2;
    const highIntent=!!cohort.offer||/replenish|lapsed|back in stock|not purchased|not bought/i.test((cohort.target||"")+(cohort.hook||""));
    const touches=[{seq:0,channel:"WA",aud:"D2C"},
      {seq:1,channel:(p.category==="Food"&&used.Email<caps.Email)?"Email":"WA",aud:"D2C"},
      {seq:2,channel:(isTop&&highIntent&&used.PN<caps.PN)?"PN":"WA",aud:"D2C"}];
    if(p.category==="Food")touches.push({seq:2,channel:"WA",aud:"Retail"});
    touches.forEach((t,ti)=>{
      if(t.channel==="Email"&&used.Email>=caps.Email)t.channel="WA";
      if(t.channel==="PN"&&used.PN>=caps.PN)t.channel="WA";
      if(t.channel==="WA"&&used.WA>=caps.WA)return;
      used[t.channel]++;
      const day=place(anchor+t.seq*3+(t.aud==="Retail"?1:0),p.species,p.category,w0,w1);
      const sq=SEQ[t.seq];
      out.push({id:`c_${f.pid}_${ti}`,pid:f.pid,cohortN:cohort.n||cN||1,channel:t.channel,aud:t.aud,
        audience:cohort.target,angle:hook,talkingPoint:hook,hookSrc,altUsed,
        seq:t.seq+1,seqName:sq.label,
        why:`${sq.why}. ${p.name} sits in the ${p.category} window (day ${day-first+1} of ${span}) because ${catStory[p.category]}; ${p.species} parents hear one category per day, so this never competes with a ${p.category==="Food"?"treat":"food"} push.`,
        date:iso(fp.year,fp.month,day),goal:f.goal,adhoc:false,status:"draft"});
    });
  });
  return out;
}
function App(){
  const [tab,setTab]=useState("dashboard");
  const [sideOpen,setSide]=useState(false);
  const [period,setPeriod]=useState("lm");
  const [catalog,setCatalog]=useState(CATALOG);
  const [fp,setFp]=useState({year:2026,month:6,half:"H1"});
  const [focus,setFocus]=useState([{pid:"swf-food",goal:2600000},{pid:"hearty-dry",goal:1900000},{pid:"nutriwag-dry",goal:1400000},{pid:"meowsi-wet",goal:1100000},{pid:"nutrimeow-dry",goal:800000}]);
  const [choices,setChoices]=useState({});
  const [locked,setLocked]=useState(false);
  const [calAssets,setCalAssets]=useState([]);
  const [briefs,setBriefs]=useState({});
  const [caps,setCaps]=useState({WA:30,PN:2,Email:3});
  const [status,setStatus]=useState(USE_MOCK?"mock":"loading");
  const [,setVer]=useState(0);
  const [toastMsg,setToast]=useState("");
  const toast=m=>{setToast(m);setTimeout(()=>setToast(""),2600)};
  useEffect(()=>{ if(USE_MOCK)return; loadData().then(()=>{setStatus("live");setVer(v=>v+1)}).catch(()=>setStatus("error")); },[]);
  function lock(){ const gen=buildCalendar(focus,choices,catalog,fp,caps); setCalAssets(gen); setLocked(true); setTab("calendar"); toast(`Calendar built · ${gen.length} priority comms`); }

  const NAV=[["dashboard","Dashboard","dash"],["catalog","Catalog","catalog"],["perf","Sales × Performance","perf"],["priority","Priorities","priority"],["strategy","Strategy","strategy"],["calendar","Calendar","calendar"]];
  const badge=status==="mock"?"MOCK":status==="live"?"LIVE":status==="loading"?"…":"API OFF";
  return <div className="app">
    <div className={"side "+(sideOpen?"open":"")}>
      <div className="logo"><div className="paw">H</div><div>CRM Strategy<small>Sales-driven planning</small></div></div>
      <div className="nav2">
        {NAV.map(([k,l,ic])=><button key={k} className={tab===k?"on":""} onClick={()=>{setTab(k);setSide(false)}}><Icon n={ic}/>{l}</button>)}
        <div className="sec">Data</div>
        <button className={tab==="import"?"on":""} onClick={()=>{setTab("import");setSide(false)}}><Icon n="import"/>Import</button>
      </div>
      <div className="side-foot"><span className="badge"><span className="live" style={status==="live"?{background:"var(--good)"}:status==="error"?{background:"var(--bad)"}:{}}></span>{BUILD} · {badge}</span></div>
    </div>
    <div className="main">
      <button className="menu-btn" onClick={()=>setSide(!sideOpen)}>☰</button>
      {tab==="dashboard"&&<Dashboard period={period} setPeriod={setPeriod}/>}
      {tab==="catalog"&&<CatalogTab catalog={catalog} setCatalog={setCatalog}/>}
      {tab==="perf"&&<SalesPerformance period={period} setPeriod={setPeriod}/>}
      {tab==="priority"&&<Priorities catalog={catalog} focus={focus} setFocus={setFocus} fp={fp} setFp={setFp}/>}
      {tab==="strategy"&&<Strategy catalog={catalog} focus={focus} choices={choices} setChoices={setChoices} fp={fp} locked={locked} setLocked={setLocked} onLock={lock} caps={caps} setCaps={setCaps}/>}
      {tab==="calendar"&&(locked?<CalendarView catalog={catalog} assets={calAssets} setAssets={setCalAssets} fp={fp} briefs={briefs} setBriefs={setBriefs} toast={toast} caps={caps} onRebuild={lock}/>:
        <div className="empty">No calendar yet.<br/><button className="btn" style={{marginTop:14}} onClick={()=>setTab("strategy")}>Go to Strategy to lock priorities →</button></div>)}
      {tab==="import"&&<ImportTab/>}
    </div>
    {toastMsg&&<div className="toast">{toastMsg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
