/* ===== real date-range engine (day-level, pro-rated over monthly data) ===== */
const DATA_MIN="2026-01-01",DATA_MAX="2026-06-30";
const parseISO=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const toISO=dt=>iso(dt.getFullYear(),dt.getMonth(),dt.getDate());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return toISO(d)};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5)+1;
function fmtRange(a,b){const A=parseISO(a),B=parseISO(b);
  if(a===b)return A.getDate()+" "+MONTHS[A.getMonth()]+" "+A.getFullYear();
  const sameM=A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear();
  return sameM?(A.getDate()+"–"+B.getDate()+" "+MONTHS[A.getMonth()]+" "+A.getFullYear())
    :(A.getDate()+" "+MONTHS[A.getMonth()].slice(0,3)+" – "+B.getDate()+" "+MONTHS[B.getMonth()].slice(0,3)+" "+B.getFullYear());}
function totalsForRange(start,end){
  const o={rev:0,units:0,orders:0,d2c:0,dog:0,cat:0,food:0,treats:0,life:0};
  const s=parseISO(start),e=parseISO(end);
  for(let m=1;m<=6;m++){const mS=new Date(2026,m-1,1),mE=new Date(2026,m-1,daysInMonth(2026,m-1));
    const lo=new Date(Math.max(s,mS)),hi=new Date(Math.min(e,mE));if(lo>hi)continue;
    const frac=(Math.round((hi-lo)/864e5)+1)/daysInMonth(2026,m-1),t=T(m);
    Object.keys(o).forEach(k=>o[k]+=(t[k]||0)*frac);}
  return o;}
function productForRange(p,start,end){let rev=0,units=0;const s=parseISO(start),e=parseISO(end);
  for(let m=1;m<=6;m++){const mS=new Date(2026,m-1,1),mE=new Date(2026,m-1,daysInMonth(2026,m-1));
    const lo=new Date(Math.max(s,mS)),hi=new Date(Math.min(e,mE));if(lo>hi)continue;
    const frac=(Math.round((hi-lo)/864e5)+1)/daysInMonth(2026,m-1),x=p.monthly[String(m)]||{rev:0,units:0};
    rev+=x.rev*frac;units+=x.units*frac;}
  return {rev:Math.round(rev),units:Math.round(units)};}
function crmForRange(start,end){const o={sends:0,sent:0,sentWA:0,sentPN:0,sentEmail:0,d2c:0,retail:0};
  const s=parseISO(start),e=parseISO(end);
  for(let m=1;m<=6;m++){const c=CAL.crm[String(m)];if(!c)continue;
    const mS=new Date(2026,m-1,1),mE=new Date(2026,m-1,daysInMonth(2026,m-1));
    const lo=new Date(Math.max(s,mS)),hi=new Date(Math.min(e,mE));if(lo>hi)continue;
    const frac=(Math.round((hi-lo)/864e5)+1)/daysInMonth(2026,m-1);
    o.sends+=c.sends*frac;o.sent+=c.sent*frac;o.sentWA+=c.sentWA*frac;o.sentPN+=c.sentPN*frac;o.sentEmail+=c.sentEmail*frac;o.d2c+=c.d2c*frac;o.retail+=c.retail*frac;}
  Object.keys(o).forEach(k=>o[k]=Math.round(o[k]));return o;}
function prevWindow(start,end){const len=daysBetween(start,end);return {start:addDays(start,-len),end:addDays(start,-1)};}

  const minISO=min||"2020-01-01",maxISO=max||"2030-12-31";

          {Array.from({length:off}).map((_,i)=><div key={"e"+i}/>)}

            <Btn sm onClick={()=>{setCohorts(cohorts.map(x=>x.id===c.id?{...x,insight:insDraft}:x));setEditIns(null)}}>Save</Btn>
            <Btn ghost sm onClick={async()=>{setInsDraft("thinking…");const r=await askAI("One sharp CRM insight (max 35 words) — trigger, lifestage, emotion, best-send-window — for cohort \""+c.name+"\" with hook \""+c.hook+"\". Indian pet-parent context.");setInsDraft(r||cohortInsight(c))}}>✨</Btn>
          </div>:<button onClick={()=>{setEditIns(c.id);setInsDraft(c.insight||"")}} style={{marginTop:5,fontSize:10.5,fontWeight:700,color:C.coral,background:"none",border:"none",cursor:"pointer",padding:0}}>{c.insight?"edit insight":"+ add your own insight"}</button>}
        </div>

          {c.links.slice(0,3).map(pid=>{const p=PRODUCTS.find(x=>x.id===pid);return p?<Tag key={pid} color={C.teal} soft={C.tealSoft}>{p.name.length>26?p.name.slice(0,25)+"…":p.name}</Tag>:null})}
          {c.links.length>3&&<Tag>+{c.links.length-3} more</Tag>}
          <button onClick={()=>{setLinkFor(linkFor===c.id?null:c.id);setPq("")}} style={{fontSize:11,fontWeight:700,border:`1px dashed ${C.line}`,background:"#fff",color:C.sub,borderRadius:999,padding:"3px 10px"}}>{linkFor===c.id?"done":"+ link product"}</button>
        </div>
        {linkFor===c.id&&<div style={{marginTop:10}}>
          <Inp placeholder="Search products…" value={pq} onChange={e=>setPq(e.target.value)}/>

            {PRODUCTS.filter(p=>pq===""||(p.name+" "+p.brand).toLowerCase().includes(pq.toLowerCase())).slice(0,30).map(p=>
              <div key={p.id} onClick={()=>toggle(c.id,p.id)} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 7px",borderRadius:7,cursor:"pointer",background:c.links.includes(p.id)?C.tealSoft:"transparent"}}>
                <span style={{width:15,height:15,borderRadius:5,border:`2px solid ${c.links.includes(p.id)?C.teal:C.line}`,background:c.links.includes(p.id)?C.teal:"#fff",color:"#fff",display:"grid",placeItems:"center",fontSize:9,fontWeight:800}}>{c.links.includes(p.id)?"✓":""}</span>
                <span style={{fontSize:11.5,fontWeight:600,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                <span style={{fontSize:10.5,color:C.sub}}>{K(p.rev)}</span>
              </div>)}
          </div>
        </div>}
      </Card>)}
    </div>
  </div>;
}

/* ===== SALES × PERFORMANCE (real, click-through) ===== */
function SalesPerformance({range,setRange,cohorts}){
  const [drill,setDrill]=useState(null);
  const [owner,setOwner]=useState("All");
  const top=[...PRODUCTS].filter(p=>owner==="All"||p.owner===owner).map(p=>({...p,pr:productForRange(p,range.start,range.end)})).sort((a,b)=>b.pr.rev-a.pr.rev).slice(0,10);
  return <div className="fade">
    <div style={{display:"flex",justifyContent:"space-between",gap:14,marginBottom:16,flexWrap:"wrap"}}>
      <div><H1>Sales × Performance</H1><Sub>Top 10 by real revenue for {fmtRange(range.start,range.end)}. Click a row for the period view and whether the CRM push helped.</Sub></div>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}><OwnerFilter owner={owner} setOwner={setOwner}/><DateRangePicker value={range} onChange={setRange} min={DATA_MIN} max={DATA_MAX}/></div>
    </div>
    <Card><div style={{padding:8}}><table>
      <thead><tr><th>#</th><th>Product</th><th>Brand</th><th className="r">Units</th><th className="r">Revenue</th><th>CRM sends (real)</th><th></th></tr></thead>
      <tbody>{top.map((p,i)=>{const as=realSendsFor(p);const good=as.some(a=>a.v==="good");const bad=as.some(a=>a.v==="bad");
        return <tr key={p.id} className="click" onClick={()=>setDrill(p)}>
          <td><span style={{display:"inline-grid",placeItems:"center",width:24,height:24,borderRadius:7,background:C.navy,color:"#fff",fontWeight:800,fontSize:11}}>{i+1}</span></td>
          <td style={{maxWidth:320}}><b>{p.name}</b> <SpTag s={p.species}/></td>
          <td style={{color:C.sub}}>{p.brand}</td>
          <td className="r">{NUM(p.pr.units)}</td>
          <td className="r"><b>{K(p.pr.rev)}</b></td>
          <td>{as.length?<Tag color={good?C.green:bad?C.red:C.amber} soft={good?C.greenSoft:bad?C.redSoft:C.amberSoft}>{as.length} send{as.length>1?"s":""}</Tag>:<Tag color={C.sub} soft="#EEF1F4">none</Tag>}</td>
          <td style={{color:C.sub}}>→</td></tr>})}</tbody>
    </table></div></Card>
    {drill&&<DrillModal p={drill} cohorts={cohorts} onClose={()=>setDrill(null)}/>}
  </div>;
}
function DrillModal({p,cohorts,onClose}){
  const rows=[
    {k:"MTD",d:"1 July 2026 to date (est. from June run-rate)",v:{rev:Math.round(p.monthly["6"].rev*5/30),units:Math.round(p.monthly["6"].units*5/30)}},
    {k:"Last month",d:"1 – 30 June 2026",v:p.monthly["6"]},
    {k:"This quarter",d:"1 April – 30 June 2026",v:pRange(p,[4,5,6])},
    {k:"Previous quarter",d:"1 January – 31 March 2026",v:pRange(p,[1,2,3])}];
  const as=realSendsFor(p);
  const good=as.filter(a=>a.v==="good"),bad=as.filter(a=>a.v==="bad");
  const mom=pct(p.monthly["6"].rev,p.monthly["5"].rev);
  const helped=as.length&&good.length>=bad.length&&mom.cls>=0;
  return <div style={{position:"fixed",inset:0,background:"rgba(31,39,52,.36)",zIndex:70,display:"flex",justifyContent:"center",alignItems:"flex-start",padding:"40px 18px",overflow:"auto"}} onClick={onClose}>
    <div style={{width:"min(840px,96vw)",background:C.paper,borderRadius:16,overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>
      <div style={{padding:"16px 20px",background:C.navy,color:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><Eyebrow color="#F4C7AC">Sales × performance</Eyebrow><div style={{fontSize:16,fontWeight:800,marginTop:2}}>{p.name}</div></div>
        <button onClick={onClose} style={{width:32,height:32,borderRadius:9,border:0,background:"rgba(255,255,255,.14)",color:"#fff",fontWeight:800}}>✕</button>
      </div>
      <div style={{padding:18}}>
        <Card><div style={{padding:6}}><table>
          <thead><tr><th>Period</th><th className="r">Units</th><th className="r">Revenue</th></tr></thead>
          <tbody>{rows.map(r=><tr key={r.k}><td><b>{r.k}</b><div style={{fontSize:10.5,color:C.sub,fontWeight:600}}>{r.d}</div></td><td className="r">{NUM(r.v.units)}</td><td className="r"><b>{K(r.v.rev)}</b></td></tr>)}</tbody>
        </table></div></Card>
        <Card style={{padding:16,marginTop:12,borderLeft:`4px solid ${helped?C.green:as.length?C.amber:C.sub}`}}>
          <Eyebrow>Did the CRM push help?</Eyebrow>
          <div style={{fontSize:14,fontWeight:800,margin:"5px 0 5px"}}>{!as.length?"No CRM push ran — opportunity":helped?"Yes — the push is moving it":"Mixed — push under-delivered"}</div>
          <Sub>{!as.length?`This sold ${K(p.rev)} in 6 months on organic demand alone. A targeted cohort push here is untapped.`
            :`${as.length} real CRM send${as.length>1?"s":""} in your calendars touch this product (${good.length} worked, ${bad.length} weak). Revenue is ${mom.t} MoM — ${helped?"consistent with the push driving incremental volume.":"the push isn't clearly moving the needle; rework the hook or cohort."}`}</Sub>
        </Card>
        <div style={{display:"flex",gap:12,marginTop:12,flexWrap:"wrap",alignItems:"stretch"}}>
          <Card style={{padding:16,flex:"1 1 260px"}}>
            <Eyebrow color={C.green}>What worked · cohorts</Eyebrow>
            {!good.length&&<Sub>No standout send yet in your calendars.</Sub>}
            {good.slice(0,4).map((a,i)=><div key={i} style={{background:C.paper,borderRadius:9,padding:"9px 11px",marginTop:8,fontSize:11.5}}><b>{fmtDate(a.date)}</b> · {a.ch} · {a.type} — CTR {a.ctr?a.ctr+"%":"—"}, read {NUM(a.read)}<br/><span style={{color:C.sub}}>{a.aud||a.obj}</span></div>)}
          </Card>
          <Card style={{padding:16,flex:"1 1 260px"}}>
            <Eyebrow color={C.red}>What didn't · cohorts</Eyebrow>
            {!bad.length&&<Sub>Nothing flagged failing.</Sub>}
            {bad.slice(0,4).map((a,i)=><div key={i} style={{background:C.paper,borderRadius:9,padding:"9px 11px",marginTop:8,fontSize:11.5}}><b>{fmtDate(a.date)}</b> · {a.ch} · {a.type} — CTR {a.ctr?a.ctr+"%":"low"}, read {NUM(a.read)}<br/><span style={{color:C.sub}}>swap the hook or move to a fresher cohort</span></div>)}
          </Card>
        </div>
      </div>
    </div>
  </div>;
}

function halfLabel(fp){return MONTHS[fp.month]+" "+fp.year+" · "+(fp.half==="H1"?"1st half (1–15)":"2nd half (16–"+daysInMonth(fp.year,fp.month)+")")}
function Priorities({focus,setFocus,fp,setFp,customs,setCustoms,cohorts}){
  const [pop,setPop]=useState(false);
  const [cust,setCust]=useState("");
  const [showAll3p,setShowAll3p]=useState(false);
  const huftPool=[...PRODUCTS].filter(p=>p.owner==="HUFT").map(p=>({...p,lm:p.monthly[String(LATEST)].rev,briefed:cohortsFor(p.id,cohorts).length})).sort((a,b)=>b.lm-a.lm);
  const p3Pool=[...PRODUCTS].filter(p=>p.owner==="3P").map(p=>({...p,lm:p.monthly[String(LATEST)].rev})).sort((a,b)=>b.rev-a.rev);
  const isOn=id=>focus.some(f=>f.pid===id);
  function toggle(p){isOn(p.id)?setFocus(focus.filter(f=>f.pid!==p.id)):setFocus([...focus,{pid:p.id,goal:Math.round((p.lm||50000)*1.15/1000)*1000}]);}
  function setGoal(id,v){setFocus(focus.map(f=>f.pid===id?{...f,goal:+v||0}:f));}
  function addCustom(){
    if(!cust.trim())return;
    const id="custom-"+Date.now();
    setCustoms([...customs,{id,name:cust.trim()}]);
    setFocus([...focus,{pid:id,goal:100000,custom:true}]);
    setCust("");
  }
  const totalGoal=focus.reduce((a,f)=>a+(f.goal||0),0);
  const nameOf=pid=>{const p=PRODUCTS.find(x=>x.id===pid);if(p)return p.name;const c=customs.find(x=>x.id===pid);return c?c.name:pid;};
  return <div className="fade">
    <div style={{display:"flex",justifyContent:"space-between",gap:14,marginBottom:16,flexWrap:"wrap"}}>
      <div><H1>Set priorities</H1><Sub>Everything is in by default — pull the scaler down to focus, or hand-pick. Type a custom product/category request if it's not in the catalog.</Sub></div>
      <div style={{position:"relative"}}>
        <button onClick={()=>setPop(!pop)} style={{display:"inline-flex",alignItems:"center",gap:8,background:"#fff",border:`1px solid ${C.line}`,borderRadius:10,padding:"9px 13px",fontSize:12.5,fontWeight:700}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.coral} strokeWidth="2" strokeLinecap="round"><path d="M7 3v3m10-3v3M4 8h16M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>
          {halfLabel(fp)} ▾</button>
        {pop&&<div style={{position:"absolute",top:"calc(100% + 6px)",right:0,background:"#fff",border:`1px solid ${C.line}`,borderRadius:12,boxShadow:"0 10px 30px rgba(31,39,52,.14)",padding:8,zIndex:60,minWidth:230}} onMouseLeave={()=>setPop(false)}>
          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
            <Btn ghost sm onClick={()=>setFp({...fp,month:(fp.month+11)%12,year:fp.month===0?fp.year-1:fp.year})}>‹</Btn>
            <div style={{flex:1,textAlign:"center",fontWeight:800,fontSize:13}}>{MONTHS[fp.month].slice(0,3)} {fp.year}</div>
            <Btn ghost sm onClick={()=>setFp({...fp,month:(fp.month+1)%12,year:fp.month===11?fp.year+1:fp.year})}>›</Btn>
          </div>
          {["H1","H2"].map(h=><button key={h} onClick={()=>setFp({...fp,half:h})} style={{display:"block",width:"100%",textAlign:"left",border:0,background:fp.half===h?C.coralSoft:"transparent",color:fp.half===h?C.coral:C.ink,padding:"9px 11px",borderRadius:8,fontSize:12.5,fontWeight:700}}>{h==="H1"?"1st half (1–15)":"2nd half (16–end)"}</button>)}
        </div>}
      </div>
    </div>

    <Card style={{padding:16,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:16,flexWrap:"wrap",alignItems:"center"}}>
        <div><Eyebrow>Focus split</Eyebrow><Sub>HUFT-owned is all-in by default. 3P is the top 10 by revenue — expand to add more.</Sub></div>
        <div style={{textAlign:"right"}}><Eyebrow>Combined revenue goal</Eyebrow>
          <div style={{fontSize:22,fontWeight:800}}>{K(totalGoal)}</div>
          <div style={{fontSize:11.5,color:C.sub}}>{focus.filter(f=>{const p=PRODUCTS.find(x=>x.id===f.pid);return p&&p.owner==="HUFT"}).length} HUFT · {focus.filter(f=>{const p=PRODUCTS.find(x=>x.id===f.pid);return p&&p.owner==="3P"}).length} 3P · {focus.filter(f=>f.custom).length} custom</div>

      <Eyebrow>Custom request / custom priority</Eyebrow>
      <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
        <Inp placeholder='Type anything — "Monsoon paw care range", "Litter — Meowsi", a new SKU…' value={cust} onChange={e=>setCust(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCustom()} style={{flex:"1 1 320px"}}/>
        <Btn onClick={addCustom}>Add to focus</Btn>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:12,alignItems:"center"}}>
        <span style={{fontSize:11,color:C.sub,fontWeight:700}}>Quick add a whole set:</span>
        {[["Dog Food","Food","Dog"],["Cat Food","Food","Cat"],["All Treats","Treats",null],["Lifestyle","Lifestyle",null]].map(([lbl,cat,sp])=>
          <Chip key={lbl} label={"+ "+lbl} color={C.purple} soft={C.purpleSoft} onClick={()=>{
            const add=PRODUCTS.filter(p=>p.category===cat&&(!sp||p.species===sp)&&!focus.some(f=>f.pid===p.id)).slice(0,12).map(p=>({pid:p.id,goal:Math.round(((p.monthly[String(LATEST)]||{}).rev||50000)*1.15/1000)*1000}));
            setFocus([...focus,...add]);

          const add=[cb.a,cb.b].filter(id=>!focus.some(f=>f.pid===id)).map(id=>{const p=PRODUCTS.find(x=>x.id===id)||{};return {pid:id,goal:Math.round(((p.monthly?p.monthly[String(LATEST)]:{}).rev||50000)*1.15/1000)*1000}});
          setFocus([...focus,...add]);

      </div>
      {customs.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
        {customs.map(c=><Tag key={c.id} color={C.purple} soft={C.purpleSoft}>{c.name} <span style={{cursor:"pointer",marginLeft:2}} onClick={()=>{setCustoms(customs.filter(x=>x.id!==c.id));setFocus(focus.filter(f=>f.pid!==c.id))}}>✕</span></Tag>)}
      </div>}
    </Card>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <Eyebrow color={C.coral}>HUFT-owned · {huftPool.length} products</Eyebrow>
      <div style={{display:"flex",gap:6}}>
        <Btn ghost sm onClick={()=>{const add=huftPool.filter(p=>!isOn(p.id)).map(p=>({pid:p.id,goal:Math.round(p.lm*1.15/1000)*1000}));setFocus([...focus,...add])}}>Select all HUFT</Btn>
        <Btn ghost sm onClick={()=>setFocus(focus.filter(f=>{const p=PRODUCTS.find(x=>x.id===f.pid);return !(p&&p.owner==="HUFT")}))}>Clear</Btn>

    </div>
    <div style={{marginBottom:20}}>
      {huftPool.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"#fff",border:`1px solid ${C.line}`,borderRadius:10,marginBottom:7}}>
        <span onClick={()=>toggle(p)} style={{width:20,height:20,borderRadius:6,border:`2px solid ${isOn(p.id)?C.coral:C.line}`,background:isOn(p.id)?C.coral:"#fff",color:"#fff",display:"grid",placeItems:"center",cursor:"pointer",fontSize:11,fontWeight:800,flexShrink:0}}>{isOn(p.id)?"✓":""}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12.5,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
          <div style={{fontSize:11,color:C.sub}}>June {K(p.lm)} · {p.briefed?p.briefed+" cohorts linked":"no cohorts yet"}</div>
        </div>
        <SpTag s={p.species}/><CatTag c={p.category}/>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:10,color:C.sub,fontWeight:700,marginBottom:2}}>GOAL</div>
          <input type="number" disabled={!isOn(p.id)} value={(focus.find(f=>f.pid===p.id)||{}).goal||""} onChange={e=>setGoal(p.id,e.target.value)} style={{width:110,border:`1px solid ${C.line}`,borderRadius:8,padding:"6px 8px",fontSize:12,textAlign:"right",background:isOn(p.id)?"#fff":"#F6F3EF"}}/>
        </div>
      </div>)}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <Eyebrow color={C.teal}>3P · top {showAll3p?p3Pool.length:10} by revenue</Eyebrow>
      <div style={{display:"flex",gap:6}}>
        <Btn ghost sm onClick={()=>{const t=p3Pool.slice(0,10).filter(p=>!isOn(p.id)).map(p=>({pid:p.id,goal:Math.round(p.lm*1.15/1000)*1000}));setFocus([...focus,...t])}}>Select top 10 3P</Btn>
        <Btn ghost sm onClick={()=>setShowAll3p(!showAll3p)}>{showAll3p?"Show top 10":"Show all 3P"}</Btn>
      </div>
    </div>
    <div>
      {(showAll3p?p3Pool.slice(0,40):p3Pool.slice(0,10)).map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"#fff",border:`1px solid ${C.line}`,borderRadius:10,marginBottom:7}}>
        <span onClick={()=>toggle(p)} style={{width:20,height:20,borderRadius:6,border:`2px solid ${isOn(p.id)?C.coral:C.line}`,background:isOn(p.id)?C.coral:"#fff",color:"#fff",display:"grid",placeItems:"center",cursor:"pointer",fontSize:11,fontWeight:800,flexShrink:0}}>{isOn(p.id)?"✓":""}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12.5,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
          <div style={{fontSize:11,color:C.sub}}>June {K(p.lm)} · {p.briefed?p.briefed+" cohorts linked":"no cohorts yet"}</div>
        </div>
        <SpTag s={p.species}/><CatTag c={p.category}/>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:10,color:C.sub,fontWeight:700,marginBottom:2}}>GOAL</div>
          <input type="number" disabled={!isOn(p.id)} value={(focus.find(f=>f.pid===p.id)||{}).goal||""} onChange={e=>setGoal(p.id,e.target.value)} style={{width:110,border:`1px solid ${C.line}`,borderRadius:8,padding:"6px 8px",fontSize:12,textAlign:"right",background:isOn(p.id)?"#fff":"#F6F3EF"}}/>
        </div>
      </div>)}
      {focus.filter(f=>f.custom).map(f=><div key={f.pid} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:C.purpleSoft,border:`1px solid #DED3F5`,borderRadius:10,marginBottom:7}}>
        <Tag color={C.purple} soft="#fff">custom</Tag>
        <div style={{flex:1,fontSize:12.5,fontWeight:700}}>{nameOf(f.pid)}</div>
        <input type="number" value={f.goal||""} onChange={e=>setGoal(f.pid,e.target.value)} style={{width:110,border:`1px solid ${C.line}`,borderRadius:8,padding:"6px 8px",fontSize:12,textAlign:"right"}}/>
      </div>)}
    </div>
  </div>;
}

/* ===== CALENDAR BUILDER (sequencing + anti-cannibalization + budget) ===== */
function buildCalendar(focus,choices,fp,caps,cohorts,customs,campaigns){
  caps=caps||{WA:30,PN:2,Email:3};
  const end=daysInMonth(fp.year,fp.month);
  const first=fp.half==="H1"?1:16,last=fp.half==="H1"?15:end,span=last-first+1;
  const days=[];for(let d=first;d<=last;d++)days.push(d);
  const isPayday=d=>d===1||d===2||(d>=25&&d<=30)||d===15;
  const catW={Food:0,Treats:1,Lifestyle:2};
  // rank focus; cap the number of *products* so 15 days aren't overloaded (WA budget / ~2 sends each)
  let items=focus.map(f=>{
    const p=PRODUCTS.find(x=>x.id===f.pid);
    if(p)return{f,p:{...p,linked:cohortsFor(p.id,cohorts)}};
    const c=customs.find(x=>x.id===f.pid);
    return c?{f,p:{id:c.id,name:c.name,brand:"Custom",species:"Dog",category:"Food",avgPrice:500,linked:[],owner:"HUFT"}}:null;
  }).filter(x=>x&&choices[x.f.pid]!=="skip");
  // prefer HUFT + higher goal; cap to what the WA budget can carry (~2 touches each)
  const maxProducts=Math.max(4,Math.floor(caps.WA/2));
  items.sort((a,b)=>((b.p.owner==="HUFT")-(a.p.owner==="HUFT"))||(catW[a.p.category]-catW[b.p.category])||((b.f.goal||0)-(a.f.goal||0)));
  items=items.slice(0,maxProducts);
  const used={WA:0,PN:0,Email:0},out=[];
  const catStory={Food:"the bowl conversation leads the fortnight",Treats:"the reward story only starts once the bowl conversation has run",Lifestyle:"lifestyle rides the tail, never against a meal or treat push"};
  // day pointers per species so one species doesn't stack on a day
  const dayLoad={},scd={};
  function place(prefDays,sp,cat){
    for(const d of prefDays){const key=sp+"|"+d;
      if(scd[key]&&scd[key]!==cat)continue; if((dayLoad[d]||0)>=3)continue;
      scd[key]=cat;dayLoad[d]=(dayLoad[d]||0)+1;return d;}
    // fallback: least-loaded day
    const best=[...days].sort((a,b)=>(dayLoad[a]||0)-(dayLoad[b]||0))[0];
    dayLoad[best]=(dayLoad[best]||0)+1;return best;
  }
  // category windows across the fortnight
  const foodDays=days.slice(0,Math.ceil(span*0.6));
  const treatDays=days.slice(Math.floor(span*0.45));
  const lifeDays=days.slice(Math.floor(span*0.6));
  items.forEach((it,idx)=>{
    const {f,p}=it;
    const pool=p.linked&&p.linked.length?p.linked:cohorts;
    const cohort=pool.find(c=>c.id===choices[f.pid])||pool[0]||{id:"x",name:"General audience",hook:"Derive from brief",offer:false};
    const ev=hookEvidence(p.id,cohort.id);
    let hook=cohort.hook,altUsed=false;
    let hookSrc=ev?(ev.worked?("Proven — conv "+ev.best.conv.toFixed(1)+"% when it last ran"):("Ran before, mixed — kept, watch it")):"Untested talking point — first outing";
    if(ev&&ev.failed){const alt=suggestAltHook(p,hook);hook=alt.hook;altUsed=true;hookSrc="Old hook failed — replaced: "+alt.src;}
    const win=p.category==="Food"?foodDays:p.category==="Treats"?treatDays:lifeDays;
    const campMatch=(campaigns||[]).find(c=>c.scope==="all"||(c.scope==="HUFT"&&p.owner==="HUFT")||(c.scope==="3P"&&p.owner==="3P")||(c.scope==="product"&&c.pid===p.id)||(!c.scope&&c.pid===p.id));
    const hi=!!cohort.offer||!!campMatch||/replenish|lapsed|back in stock|not (purchased|bought)/i.test(cohort.name+" "+cohort.hook);
    // 3-touch arc, spread ~ every 3-4 days, payday-biased for the offer/close touch
    const base=win[(idx*3)%win.length];
    const touches=[{seq:0,channel:"WA",aud:"D2C",off:0},
      {seq:1,channel:(p.category==="Food"&&used.Email<caps.Email)?"Email":"WA",aud:"D2C",off:3},
      {seq:2,channel:(idx<2&&hi&&used.PN<caps.PN)?"PN":"WA",aud:"D2C",off:6}];
    if(p.category==="Food")touches.push({seq:2,channel:"WA",aud:"Retail",off:5});
    touches.forEach((t,ti)=>{
      if(t.channel==="Email"&&used.Email>=caps.Email)t.channel="WA";
      if(t.channel==="PN"&&used.PN>=caps.PN)t.channel="WA";
      if(t.channel==="WA"&&used.WA>=caps.WA)return;
      used[t.channel]++;
      // prefer payday days for offer/close touch
      let pref=win.filter(d=>d>=base+t.off-2&&d<=base+t.off+2);
      if(t.seq>=2&&hi){const pd=pref.filter(isPayday);if(pd.length)pref=pd.concat(pref);}
      if(!pref.length)pref=win;
      const day=place(pref,p.species,p.category);
      const sq=SEQ[t.seq];
      out.push({id:"k_"+f.pid+"_"+ti,pid:p.id,pname:p.name,species:p.species,category:p.category,avgPrice:p.avgPrice||500,
        cohortId:cohort.id,audience:cohort.name,channel:t.channel,aud:t.aud,goal:f.goal,
        talkingPoint:hook,hookSrc,altUsed,seq:t.seq+1,seqName:sq.label,offerText:campMatch?((campMatch.offer||campMatch.name)):null,
        objective:inferObjective(cohort.name),lifestage:cohortInsight(cohort).match(/Lifestage: ([^.]+)/)?cohortInsight(cohort).match(/Lifestage: ([^.]+)/)[1]:"",
        why:sq.why+". "+p.name+" sits in the "+p.category+" window because "+catStory[p.category]+"; "+p.species+" parents hear one category per day"+(isPayday(day)&&t.seq>=2?"; landed on a payday window for the conversion touch":"")+".",
        date:iso(fp.year,fp.month,day),adhoc:false,status:"draft"});
    });
  });
  return out;
}
function findConflicts(assets){
  const out=[],byDay={};
  assets.forEach(a=>{byDay[a.date]=byDay[a.date]||[];byDay[a.date].push(a)});
  Object.entries(byDay).forEach(([d,list])=>{
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const A=list[i],B=list[j];
      if(A.species!==B.species)continue;
      if(A.category!==B.category)out.push({date:d,msg:`${fmtDate(d)}: ${A.pname} (${A.category}) and ${B.pname} (${B.category}) both talk to ${A.species} parents — competing for the same wallet`});
      else if(A.pid!==B.pid)out.push({date:d,msg:`${fmtDate(d)}: two ${A.category} pushes to ${A.species} parents (${A.pname} vs ${B.pname}) — pick one`});
    }
  });
  return out;
}

const AUD_OPTS=["High-Value Loyalist","Lapsed Buyer · 60–90 Days","Anxious First-Timer","Existing HUFT Customer","Post-Grooming Lapsed","Busy Urban Pet Parent"];
const chFull={WA:"WhatsApp",PN:"Push notification",Email:"Email"};
const chCls={WA:"#25946b",PN:"#3b6fd4",Email:"#b6602a"};
const BRIEF_FIELDS=[
 {k:"mode",q:"Is this D2C or Retail?",req:1,help:"Retail = WhatsApp only, no web/app links. D2C = all channels OK.",opts:["D2C","Retail","Hybrid"]},
 {k:"channel",q:"Which channel?",req:1,help:"Copy format, length and emoji rules change by channel.",opts:["WhatsApp","Email","Push notification","WhatsApp + Email"]},
 {k:"product",q:"Which product, sub-brand, or category?",req:1,free:"Or type a specific SKU / variant…"},
 {k:"pillar",q:"Which HUFT pillar should lead?",help:"Trust = calm & honest. Importance = personal & warm. Edutainment = joyful. Values = purpose-led. Discovery = revealing.",opts:["Importance","Trust","Edutainment","Brand Values","Discovery"]},
 {k:"audience",q:"Who's the audience?",req:1,opts:AUD_OPTS,free:"Or describe your own segment…"},
 {k:"lifestage",q:"What's the lifestage — the moment that prompts this?",opts:["Ran out / replenishment due","Lapsed 60–90 days","New pet just adopted","Vet flagged an issue","Price / value comparison","Seasonal / weather"],free:"Or describe the moment…"},
 {k:"objective",q:"What's the objective?",req:1,opts:["Win-back / Reactivation","Conversion (first purchase)","Upsell / Cross-sell","Retention / Loyalty","Product education","Seasonal / topical"],free:"Or describe your own…"},
 {k:"offer",q:"Is there an offer or incentive?",opt:1,opts:["None — brand/product story only","Free shipping","Free gift with purchase"],free:"e.g. Flat 10% off · Rs.65 intro price…"},
 {k:"angle",q:"Any specific angle or creative hook?",opt:1,opts:["No specific angle — derive from brief","PawDay Sale"],free:"Or type a specific direction…"},
 {k:"message",q:"What's the one message you most want them to take away?",req:1,opts:["Slow-cooked to retain nutrients","Real, human-grade ingredients — no fillers","0% preservatives, no additives","Balanced by canine/feline nutritionists","Made in India","Vet-aware, science-backed"],free:"Or type the one message…"},
 {k:"links",q:"Any reference links to guide copy & design?",opt:1,free:"Paste a URL…"},
 {k:"golive",q:"When does this asset go live?",req:1,help:"Sets the campaign week and TAT deadlines.",type:"date"}];
function inferObjective(t){t=(t||"").toLowerCase();
  if(/lapsed|win|not (purchased|bought)/.test(t))return "Win-back / Reactivation";
  if(/non-|haven't|first|new|upgrader|economy/.test(t))return "Conversion (first purchase)";
  if(/existing|attach|cross|buyers/.test(t))return "Upsell / Cross-sell";
  return "Retention / Loyalty";}
function inferPillar(obj,cat){const o=(obj||"").toLowerCase();
  if(o.includes("win-back")||o.includes("retention"))return "Importance";
  if(o.includes("conversion")||o.includes("first"))return "Trust";
  if(o.includes("education"))return "Edutainment";
  if(o.includes("seasonal"))return "Discovery";
  return cat==="Treats"?"Edutainment":"Importance";}
function briefFromAsset(a){
  return {mode:a.aud||"D2C",channel:chFull[a.channel]||"WhatsApp",product:a.pname,
    audience:a.audience||"",lifestage:/lapsed/i.test(a.audience||"")?"Lapsed 60–90 days":"",
    objective:inferObjective(a.audience),offer:a.offerText||"None — brand/product story only",
    angle:a.talkingPoint||"No specific angle — derive from brief",message:a.talkingPoint||"",
    pillar:inferPillar(inferObjective(a.audience),a.category),links:"",golive:a.date};}
function briefPayload(v){
  const L=["CRM CREATIVE BRIEF — "+(v.product||"(product)"),
   "Mode: "+(v.mode||"—")+"  |  Channel: "+(v.channel||"—"),
   "Audience: "+(v.audience||"—")];
  if(v.lifestage)L.push("Lifestage / moment: "+v.lifestage);
  L.push("Objective: "+(v.objective||"—"),"Lead pillar: "+(v.pillar||"—"),
   "Offer: "+(v.offer||"None — brand/product story only"),
   "Angle / hook: "+(v.angle||"Derive from brief"),
   "One key message: "+(v.message||"—"));
  if(v.links)L.push("References: "+v.links);
  L.push("Go-live: "+(v.golive||"—"));
  return L.join("\n");}
function Brief({asset,value,onChange,onLoad,onMoveDate}){
  const need=BRIEF_FIELDS.filter(f=>f.req&&!value[f.k]).length;

        {f.help&&<div style={{fontSize:11.5,color:C.sub,margin:"3px 0 9px",lineHeight:1.45}}>{f.help}</div>}
        {f.type==="date"?<input type="date" value={value[f.k]||""} onChange={e=>set(f.k,e.target.value)} style={{border:`1px solid ${C.line}`,borderRadius:9,padding:"8px 11px",fontSize:12.5}}/>

      </div>)}

        <div style={{fontSize:13,fontWeight:800}}>Brief payload <span style={{color:C.sub,fontSize:11,fontWeight:600}}>· exactly what loads to the Creative Engine</span></div>

function RuleBook(){
  const S=({t,items})=><Card style={{padding:16,marginBottom:13}}>
    <Eyebrow>{t}</Eyebrow>
    <div style={{marginTop:8}}>{items.map((x,i)=><div key={i} style={{display:"flex",gap:10,padding:"7px 0",borderBottom:i<items.length-1?"1px solid #F1EDE8":"none",fontSize:12.5,lineHeight:1.5}}>
      <span style={{color:C.coral,fontWeight:800}}>{String(i+1).padStart(2,"0")}</span><span>{x}</span></div>)}</div>
  </Card>;
  return <div className="fade">
    <div style={{marginBottom:16}}><H1>Rule book</H1><Sub>The trends and rules every plan, sequence, and communication follows. The calendar engine enforces these automatically.</Sub></div>
    <S t="Portfolio rules" items={[
      "Dog 60% / Cat 40% revenue split is the standing target — the dashboard flags drift.",
      "Category priority is fixed: 1. Food → 2. Treats → 3. Lifestyle. Food earns the front of every fortnight.",
      "Minimum order value ₹699 — offer-led comms should push carts past it, never below.",
      "HUFT-owned brands lead; 3P appears where it defends the basket (RC, Farmina, Sheba anchors)."]}/>
    <S t="Channel rules" items={[
      "Hard monthly caps: 60 WhatsApp · 4 Push · a handful of emails. Fortnight defaults 30 / 2 / 3 — adjustable, never silently exceeded.",
      "PN is scarce: reserved for top-priority SKUs at their highest-intent moment (offer live, lapsed win-back, replenishment due).",
      "Retail comms are WhatsApp-only — no web/app links. D2C can use all channels.",
      "Email carries the deeper Food story (ingredients, proof); WhatsApp is the workhorse; PN is the nudge."]}/>
    <S t="Sequencing & anti-cannibalization" items={[
      "Every product runs a 3-touch arc: Open the story → Prove it → Close/nudge, spaced ~3 days so the ask lands after the proof.",
      "One category per species per day — when we talk food to dog parents, we do not talk treats to them the same day.",
      "Food leads the fortnight; the Treats (reward) story only starts once the bowl conversation has run; Lifestyle rides the tail.",
      "Ad-hoc additions and date moves are checked live — the calendar flags any same-wallet collision."]}/>
    <S t="Timing rules · India" items={[
      "Payday windows: salary credits cluster on the 1st, month-end (25th–30th), and mid-month. Schedule higher-AOV food and value-pack pushes 1–3 days into these windows.",
      "Weekend browse, weekday buy: enrichment/toys/treats over-index Sat–Sun; replenishment food converts Mon–Wed.",
      "Replenishment beats persuasion: once a food is trusted, time the reminder to the RP (run-out) date — a nudge outperforms a new claim.",
      "PN fatigue: more than 4 push/month erodes read rates — reserve PN for genuine urgency (run-out, live offer, restock)."]}/>
    <S t="Emotional & customer-pattern rules" items={[
      "Pets are family: first-person-pet framing ('your baby deserves…') beats feature-led copy for treats & premium food.",
      "Guilt is the premium lever: 'feeding better' resolves the guilt of not home-cooking — lead Sara's/Hearty on honesty & visibility.",
      "Anxious first-timers want reassurance, not discounts — new-pet cohorts respond to guidance and proof.",
      "Cats are palatability-first: switch cat parents on taste & acceptance, not ingredient decks.",
      "Festive premiumisation (Sep–Nov): shift to gifting & premium bundles; protect MOV ₹699 with bundles, not deep discounts.",
      "Trust compounds: repeat food buyers respond to loyalty & subscription seeding far more than acquisition offers."]}/>
    <S t="Talking-point rules" items={[
      "Every talking point carries evidence: proven (repeat it), mixed (keep, watch), or failed (auto-replaced).",
      "A hook that failed does not run again unchanged — the engine swaps in a proven sibling hook or a fresh playbook angle as an A/B.",
      "Campaigns and offers must name the product they belong to; the offer flows into that product's briefs automatically.",
      "Untested angles run small before they run wide."]}/>
    <S t="Seasonal trend map (what each month leans on)" items={MONTHS.map((m,i)=>m+" — "+seasonalNote(i))}/>
  </div>;
}

/* ===== UPLOAD (performance docs & content calendars) ===== */
const DOC_KINDS=["CleverTap performance report","Content calendar (last 6 months)","Retail comms log","Other"];
function UploadTab(){
  const [file,setFile]=useState(null),[rows,setRows]=useState(null),[kind,setKind]=useState(DOC_KINDS[0]);
  const [desc,setDesc]=useState(""),[insights,setInsights]=useState(null),[busy,setBusy]=useState(false),[done,setDone]=useState(false);
  const inp=useRef();
  function handle(f){if(!f)return;setFile(f);setInsights(null);setDone(false);setRows(null);
    if(/\.csv$/i.test(f.name))Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>setRows(r.data)});}
  async function extract(){
    setBusy(true);const ins=[];
    if(rows&&rows.length){
      const cols=Object.keys(rows[0]);
      ins.push({t:"Structure",d:`${rows.length} rows · columns: ${cols.slice(0,8).join(", ")}${cols.length>8?"…":""}`});
      const rc=cols.find(c=>/rev/i.test(c)),nc=cols.find(c=>/campaign|name|asset|title|comm/i.test(c)),cc=cols.find(c=>/channel/i.test(c)),tc=cols.find(c=>/ctr|click/i.test(c)),ac=cols.find(c=>/aud|type|d2c|retail/i.test(c));
      if(rc&&nc){const top=[...rows].sort((a,b)=>(parseFloat(b[rc])||0)-(parseFloat(a[rc])||0))[0];ins.push({t:"Top performer",d:`“${top[nc]}” — ₹${(parseFloat(top[rc])||0).toLocaleString("en-IN")} revenue`});}
      if(tc){const v=rows.map(r=>parseFloat(r[tc])||0);ins.push({t:"CTR read",d:`Average ${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)}% · best ${Math.max(...v).toFixed(2)}%`});}
      if(cc){const by={};rows.forEach(r=>{by[r[cc]||"—"]=(by[r[cc]||"—"]||0)+1});ins.push({t:"Channel mix",d:Object.entries(by).map(([k,v])=>k+": "+v).join(" · ")});}
      if(ac){const by={};rows.forEach(r=>{by[r[ac]||"—"]=(by[r[ac]||"—"]||0)+1});ins.push({t:"D2C vs Retail in this doc",d:Object.entries(by).map(([k,v])=>k+": "+v).join(" · ")});}
    }else if(file){ins.push({t:"File noted",d:`“${file.name}” isn't a CSV — export the sheet as CSV for structured extraction. Logged with your note for review.`});}
    const ai=await askAI(`You are the HUFT CRM strategy engine. Uploaded: ${kind}. User note: "${desc||"none"}". Extracted stats: ${ins.map(x=>x.t+": "+x.d).join(" | ")}. Give exactly 3 short, sharp insights and 1 recommended action for next fortnight's CRM plan. Plain text, no markdown.`);
    ins.push(ai?{t:"AI read",d:ai}:{t:"AI read",d:"AI key not set — rule-based extraction shown. Add a key from the sidebar (⚙ AI key) for narrative insights."});
    setInsights(ins);setBusy(false);
  }
  return <div className="fade">
    <div style={{marginBottom:16}}><H1>Upload</H1><Sub>Upload performance documents or content calendars. Say what the document is — the engine pulls the right insights and shows them before ingest.</Sub></div>
    <Card style={{padding:14,marginBottom:14,borderLeft:`4px solid ${C.green}`}}>
      <Eyebrow color={C.green}>Already ingested</Eyebrow>
      <div style={{fontSize:12.5,marginTop:5}}>Your <b>6 monthly content calendars (Jan–Jun 2026)</b> are loaded — <b>{NUM(CAL.totalSends)} CRM sends</b>, {NUM(CAL.totalSent)} messages. Feeding Dashboard channel reach, top audiences, and the CRM-push evidence in Sales × Performance.</div>
    </Card>
    <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:10}}>
      {DOC_KINDS.map(k=><Chip key={k} label={k} active={kind===k} onClick={()=>setKind(k)}/>)}
    </div>
    <Inp placeholder="What is this document for? — e.g. “June CleverTap export, all WA campaigns” or “Retail calendar Feb–Jun with delivery numbers”" value={desc} onChange={e=>setDesc(e.target.value)} style={{marginBottom:12}}/>
    <input ref={inp} type="file" accept=".csv,.xlsx,.pdf" style={{display:"none"}} onChange={e=>handle(e.target.files[0])}/>
    <div onClick={()=>inp.current.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handle(e.dataTransfer.files[0])}}
      style={{border:"2px dashed #F4C7AC",background:C.coralSoft+"66",borderRadius:14,padding:32,textAlign:"center",cursor:"pointer"}}>
      <div style={{fontSize:28}}>📤</div><div style={{fontWeight:800,marginTop:8}}>Drop the document, or click to browse</div>
      <Sub>{file?file.name+(rows?` · ${rows.length} rows parsed`:""):"CSV parses fully; xlsx/pdf are logged for review (export sheets as CSV for full extraction)"}</Sub>
    </div>
    <div style={{display:"flex",gap:10,marginTop:12,alignItems:"center"}}>
      <Btn disabled={!file||busy} onClick={extract}>{busy?"Reading…":"Extract insights"}</Btn>
      {insights&&!done&&<Btn dark onClick={()=>{setDone(true)}}>Looks right — ingest</Btn>}
      {done&&<span style={{fontSize:12,fontWeight:800,color:C.green}}>Ingested — feeding Sales × Performance and talking-point evidence.</span>}
    </div>
    {insights&&<div style={{marginTop:14,display:"grid",gap:10}}>
      {insights.map((x,i)=><Card key={i} style={{padding:14,borderLeft:`4px solid ${x.t==="AI read"?C.purple:C.teal}`}}>
        <Eyebrow color={x.t==="AI read"?C.purple:C.teal}>{x.t}</Eyebrow>
        <div style={{fontSize:12.5,marginTop:5,whiteSpace:"pre-wrap",lineHeight:1.55}}>{x.d}</div>
      </Card>)}
    </div>}
  </div>;
}

      </div>
      <div style={{padding:"10px 12px 14px",borderTop:"1px solid rgba(255,255,255,.08)",display:"flex",flexDirection:"column",gap:8}}>
        <button onClick={()=>{const k=window.prompt("Paste your Anthropic API key (stored only in this browser). Leave empty to clear:",AI_KEY||"");if(k!==null){AI_KEY=k.trim();try{localStorage.setItem("strat_ai_key",AI_KEY)}catch(e){}}}} style={{display:"flex",alignItems:"center",gap:8,border:"1px solid rgba(255,255,255,.14)",borderRadius:9,padding:"8px 11px",fontWeight:700,background:"rgba(255,255,255,.04)",color:AI_KEY?"#7EE0B0":"rgba(255,255,255,.62)",fontSize:11.5,textAlign:"left",cursor:"pointer"}}>
          <span style={{width:7,height:7,borderRadius:99,background:AI_KEY?C.green:"rgba(255,255,255,.4)"}}/> AI key {AI_KEY?"· connected":"· add for insights"}</button>
      </div>
    </div>
    <div style={{flex:1,minWidth:0,padding:"24px 26px 80px",maxWidth:1220}}>
      {tab==="dashboard"&&<Dashboard range={range} setRange={setRange}/>}
      {tab==="catalog"&&<CatalogTab cohorts={cohorts} setCohorts={setCohorts}/>}
      {tab==="cohorts"&&<CohortsTab cohorts={cohorts} setCohorts={setCohorts}/>}
      {tab==="perf"&&<SalesPerformance range={range} setRange={setRange} cohorts={cohorts}/>}
      {tab==="insights"&&<InsightsTab cohorts={cohorts}/>}
      {tab==="priority"&&<Priorities focus={focus} setFocus={setFocus} fp={fp} setFp={setFp} customs={customs} setCustoms={setCustoms} cohorts={cohorts}/>}
      {tab==="strategy"&&<Strategy focus={focus} setFocus={setFocus} choices={choices} setChoices={setChoices} fp={fp} caps={caps} setCaps={setCaps} onLock={lock} locked={locked} cohorts={cohorts} setCohorts={setCohorts} customs={customs} campaigns={campaigns} setCampaigns={setCampaigns}/>}
      {tab==="calendar"&&(locked?<CalendarView assets={calAssets} setAssets={setCalAssets} fp={fp} briefs={briefs} setBriefs={setBriefs} toast={toast} caps={caps} onRebuild={lock} cohorts={cohorts}/>
        :<div style={{textAlign:"center",padding:50,color:C.sub}}>No calendar yet.<br/><Btn style={{marginTop:14}} onClick={()=>setTab("strategy")}>Go to Strategy to lock priorities →</Btn></div>)}
      {tab==="rules"&&<RuleBook/>}
      {tab==="import"&&<UploadTab/>}
    </div>
    {toastMsg&&<div style={{position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",background:C.navy,color:"#fff",padding:"12px 18px",borderRadius:12,fontSize:12.5,fontWeight:700,boxShadow:"0 10px 30px rgba(0,0,0,.25)",zIndex:90}}>{toastMsg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
