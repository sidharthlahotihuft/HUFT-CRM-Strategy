function DrillModal({p,cohorts,onClose}){

        </Card>
        <div style={{display:"flex",gap:12,marginTop:12,flexWrap:"wrap",alignItems:"stretch"}}>
          <Card style={{padding:16,flex:"1 1 260px"}}>
            <Eyebrow color={C.green}>What worked · cohorts</Eyebrow>

  const p3Pool=[...PRODUCTS].filter(p=>p.owner==="3P").map(p=>({...p,lm:p.monthly[String(LATEST)].rev})).sort((a,b)=>b.rev-a.rev);
  const isOn=id=>focus.some(f=>f.pid===id);

  function setGoal(id,v){setFocus(focus.map(f=>f.pid===id?{...f,goal:+v||0}:f));}

    setCustoms([...customs,{id,name:cust.trim()}]);
    setFocus([...focus,{pid:id,goal:100000,custom:true}]);

  const nameOf=pid=>{const p=PRODUCTS.find(x=>x.id===pid);if(p)return p.name;const c=customs.find(x=>x.id===pid);return c?c.name:pid;};

/* ===== CALENDAR BUILDER (sequencing + anti-cannibalization + budget) ===== */
function buildCalendar(focus,choices,fp,caps,cohorts,customs,campaigns){
  caps=caps||{WA:30,PN:2,Email:3};
  const end=daysInMonth(fp.year,fp.month);
  const first=fp.half==="H1"?1:16,last=fp.half==="H1"?15:end,span=last-first+1;
  const catW={Food:0,Treats:1,Lifestyle:2};
  const items=focus.map(f=>{
    const p=PRODUCTS.find(x=>x.id===f.pid);
    if(p)return{f,p:{...p,linked:cohortsFor(p.id,cohorts)}};
    const c=customs.find(x=>x.id===f.pid);
    return c?{f,p:{id:c.id,name:c.name,brand:"Custom",species:"Dog",category:"Food",avgPrice:500,linked:[]}}:null;
  }).filter(Boolean)
    .sort((a,b)=>(catW[a.p.category]-catW[b.p.category])||((b.f.goal||0)-(a.f.goal||0))).slice(0,12);
  const used={WA:0,PN:0,Email:0},out=[];
  const catStory={Food:"the bowl conversation leads the fortnight",Treats:"the reward story only starts once the bowl conversation has run",Lifestyle:"lifestyle rides the tail, never against a meal or treat push"};
  function windowFor(c){if(c==="Food")return[first,first+Math.max(3,Math.floor(span*0.55))-1];if(c==="Treats")return[first+Math.floor(span*0.4),last];return[Math.max(first,last-3),last]}
  const dayLoad={},scd={},catIdx={};
  function place(want,sp,cat,w0,w1){
    for(let off=0;off<=span;off++){for(const cand of off===0?[want]:[want+off,want-off]){
      if(cand<w0||cand>w1)continue;const key=sp+"|"+cand;
      if(scd[key]&&scd[key]!==cat)continue;if((dayLoad[cand]||0)>=3)continue;
      scd[key]=cat;dayLoad[cand]=(dayLoad[cand]||0)+1;return cand;}}
    return Math.min(Math.max(want,w0),w1);
  }
  items.forEach((it,idx)=>{
    const {f,p}=it;
    const pool=p.linked&&p.linked.length?p.linked:cohorts;
    const cohort=pool.find(c=>c.id===choices[f.pid])||pool[0]||{id:"x",name:"General audience",hook:"Derive from brief",offer:false};
    const ev=hookEvidence(p.id,cohort.id);
    let hook=cohort.hook,altUsed=false;
    let hookSrc=ev?(ev.worked?`Proven — conv ${ev.best.conv.toFixed(1)}% / CTR ${ev.best.ctr.toFixed(1)}% when it last ran`:`Ran before with mixed results (conv ${ev.best.conv.toFixed(1)}%) — kept, watch it`):"Untested talking point — first outing";
    if(ev&&ev.failed){const alt=suggestAltHook(p,hook);hook=alt.hook;altUsed=true;hookSrc=`Old hook failed (conv ${ev.best.conv.toFixed(1)}%) — replaced: ${alt.src}`;}
    const [w0,w1]=windowFor(p.category);
    const ck=p.category+p.species;const ci=(catIdx[ck]=catIdx[ck]||0);catIdx[ck]++;
    const anchor=w0+(ci*2)%Math.max(1,w1-w0);
    const isTop=idx<2;
    const campMatch=(campaigns||[]).find(c=>c.scope==="all"||(c.scope==="HUFT"&&p.owner==="HUFT")||(c.scope==="3P"&&p.owner==="3P")||(c.scope==="product"&&c.pid===p.id)||(!c.scope&&c.pid===p.id));
    const hi=!!cohort.offer||!!campMatch||/replenish|lapsed|back in stock|not (purchased|bought)/i.test(cohort.name+" "+cohort.hook);
    const touches=[{seq:0,channel:"WA",aud:"D2C"},
      {seq:1,channel:(p.category==="Food"&&used.Email<caps.Email)?"Email":"WA",aud:"D2C"},
      {seq:2,channel:(isTop&&hi&&used.PN<caps.PN)?"PN":"WA",aud:"D2C"}];
    if(p.category==="Food")touches.push({seq:2,channel:"WA",aud:"Retail"});
    touches.forEach((t,ti)=>{
      if(t.channel==="Email"&&used.Email>=caps.Email)t.channel="WA";
      if(t.channel==="PN"&&used.PN>=caps.PN)t.channel="WA";
      if(t.channel==="WA"&&used.WA>=caps.WA)return;
      used[t.channel]++;
      const day=place(anchor+t.seq*3+(t.aud==="Retail"?1:0),p.species,p.category,w0,w1);
      const sq=SEQ[t.seq];
      out.push({id:`k_${f.pid}_${ti}`,pid:p.id,pname:p.name,species:p.species,category:p.category,avgPrice:p.avgPrice||500,
        cohortId:cohort.id,audience:cohort.name,channel:t.channel,aud:t.aud,
        talkingPoint:hook,hookSrc,altUsed,seq:t.seq+1,seqName:sq.label,
        offerText:campMatch?((campMatch.offer||campMatch.name)+(campMatch.name&&campMatch.offer?" ("+campMatch.name+")":"")):null,
        why:`${sq.why}. ${p.name} sits in the ${p.category} window (day ${day-first+1} of ${span}) because ${catStory[p.category]}; ${p.species} parents hear one category per day — this never competes with a ${p.category==="Food"?"treat":"food"} push.`,
        date:iso(fp.year,fp.month,day),goal:f.goal,adhoc:false,status:"draft"});
    });
  });
  return out;
}
function findConflicts(assets){
  const out=[],byDay={};
  assets.forEach(a=>{byDay[a.date]=byDay[a.date]||[];byDay[a.date].push(a)});
  Object.entries(byDay).forEach(([d,list])=>{
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const A=list[i],B=list[j];
      if(A.species!==B.species)continue;
      if(A.category!==B.category)out.push({date:d,msg:`${fmtDate(d)}: ${A.pname} (${A.category}) and ${B.pname} (${B.category}) both talk to ${A.species} parents — competing for the same wallet`});
      else if(A.pid!==B.pid)out.push({date:d,msg:`${fmtDate(d)}: two ${A.category} pushes to ${A.species} parents (${A.pname} vs ${B.pname}) — pick one`});
    }
  });
  return out;
}

const BRIEF_FIELDS=[
 {k:"mode",q:"Is this D2C or Retail?",req:1,help:"Retail = WhatsApp only, no web/app links. D2C = all channels OK.",opts:["D2C","Retail","Hybrid"]},
 {k:"channel",q:"Which channel?",req:1,help:"Copy format, length and emoji rules change by channel.",opts:["WhatsApp","Email","Push notification","WhatsApp + Email"]},
 {k:"product",q:"Which product, sub-brand, or category?",req:1,free:"Or type a specific SKU / variant…"},
 {k:"pillar",q:"Which HUFT pillar should lead?",help:"Trust = calm & honest. Importance = personal & warm. Edutainment = joyful. Values = purpose-led. Discovery = revealing.",opts:["Importance","Trust","Edutainment","Brand Values","Discovery"]},
 {k:"audience",q:"Who's the audience?",req:1,opts:AUD_OPTS,free:"Or describe your own segment…"},
 {k:"lifestage",q:"What's the lifestage — the moment that prompts this?",opts:["Ran out / replenishment due","Lapsed 60–90 days","New pet just adopted","Vet flagged an issue","Price / value comparison","Seasonal / weather"],free:"Or describe the moment…"},
 {k:"objective",q:"What's the objective?",req:1,opts:["Win-back / Reactivation","Conversion (first purchase)","Upsell / Cross-sell","Retention / Loyalty","Product education","Seasonal / topical"],free:"Or describe your own…"},
 {k:"offer",q:"Is there an offer or incentive?",opt:1,opts:["None — brand/product story only","Free shipping","Free gift with purchase"],free:"e.g. Flat 10% off · Rs.65 intro price…"},
 {k:"angle",q:"Any specific angle or creative hook?",opt:1,opts:["No specific angle — derive from brief","PawDay Sale"],free:"Or type a specific direction…"},
 {k:"message",q:"What's the one message you most want them to take away?",req:1,opts:["Slow-cooked to retain nutrients","Real, human-grade ingredients — no fillers","0% preservatives, no additives","Balanced by canine/feline nutritionists","Made in India","Vet-aware, science-backed"],free:"Or type the one message…"},
 {k:"links",q:"Any reference links to guide copy & design?",opt:1,free:"Paste a URL…"},
 {k:"golive",q:"When does this asset go live?",req:1,help:"Sets the campaign week and TAT deadlines.",type:"date"}];
function inferObjective(t){t=(t||"").toLowerCase();
  if(/lapsed|win|not (purchased|bought)/.test(t))return "Win-back / Reactivation";
  if(/non-|haven't|first|new|upgrader|economy/.test(t))return "Conversion (first purchase)";
  if(/existing|attach|cross|buyers/.test(t))return "Upsell / Cross-sell";
  return "Retention / Loyalty";}
function inferPillar(obj,cat){const o=(obj||"").toLowerCase();
  if(o.includes("win-back")||o.includes("retention"))return "Importance";
  if(o.includes("conversion")||o.includes("first"))return "Trust";
  if(o.includes("education"))return "Edutainment";
  if(o.includes("seasonal"))return "Discovery";
  return cat==="Treats"?"Edutainment":"Importance";}
function briefFromAsset(a){
  return {mode:a.aud||"D2C",channel:chFull[a.channel]||"WhatsApp",product:a.pname,
    audience:a.audience||"",lifestage:/lapsed/i.test(a.audience||"")?"Lapsed 60–90 days":"",
    objective:inferObjective(a.audience),offer:a.offerText||"None — brand/product story only",
    angle:a.talkingPoint||"No specific angle — derive from brief",message:a.talkingPoint||"",
    pillar:inferPillar(inferObjective(a.audience),a.category),links:"",golive:a.date};}
function briefPayload(v){

   "Mode: "+(v.mode||"—")+"  |  Channel: "+(v.channel||"—"),
   "Audience: "+(v.audience||"—")];
  if(v.lifestage)L.push("Lifestage / moment: "+v.lifestage);
  L.push("Objective: "+(v.objective||"—"),"Lead pillar: "+(v.pillar||"—"),
   "Offer: "+(v.offer||"None — brand/product story only"),
   "Angle / hook: "+(v.angle||"Derive from brief"),
   "One key message: "+(v.message||"—"));
  if(v.links)L.push("References: "+v.links);
  L.push("Go-live: "+(v.golive||"—"));
  return L.join("\n");}

        <div style={{maxWidth:620}}><Eyebrow>Plan logic</Eyebrow>
          <Sub>Food leads the fortnight, Treats follows as the reward story, Lifestyle rides the tail. Each species hears <b>one category per day</b> — when we talk food we don't talk treats. Every product runs a 3-touch arc: open → prove → close. PN is rationed to the highest-intent moments.</Sub></div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          <Tag color="#25946b" soft="#E7F3EC">WA {useCt.WA}/{caps.WA}</Tag>
          <Tag color="#3b6fd4" soft="#EAF0FB">PN {useCt.PN}/{caps.PN}</Tag>
          <Tag color="#b6602a" soft="#FBEFE6">Email {useCt.Email}/{caps.Email}</Tag>
          {conf.length===0?<Tag color={C.green} soft={C.greenSoft}>No cannibalization</Tag>:<Tag color={C.red} soft={C.redSoft}>{conf.length} conflict{conf.length>1?"s":""}</Tag>}
        </div>
      </div>
      {conf.length>0&&<div style={{marginTop:10}}>{conf.slice(0,4).map((c,i)=><div key={i} style={{background:C.redSoft,borderRadius:8,padding:"8px 11px",marginBottom:6,fontSize:11.5,color:C.red,fontWeight:600}}>⚠ {c.msg}</div>)}</div>}
    </Card>
    <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12,alignItems:"center"}}>
      <Tog k="WA_D2C" label="WA · D2C" cls="#25946b"/><Tog k="WA_Retail" label="WA · Retail" cls="#1c7a4f"/><Tog k="PN" label="Push" cls="#3b6fd4"/><Tog k="Email" label="Email" cls="#b6602a"/>
      <span style={{width:8}}/><span style={{fontSize:11.5,color:C.sub,fontWeight:700}}>Audience:</span>
      <select value={aud} onChange={e=>setAud(e.target.value)} style={{border:`1px solid ${C.line}`,borderRadius:9,padding:"7px 10px",fontSize:12,background:"#fff",maxWidth:280}}>{auds.map(a=><option key={a}>{a.length>44?a.slice(0,43)+"…":a}</option>)}</select>
    </div>
    <div style={sel?{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"start"}:{}}>
      <div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
          {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} style={{fontSize:10,fontWeight:800,color:C.sub,textTransform:"uppercase",letterSpacing:.4,textAlign:"center",padding:"4px 0"}}>{d}</div>)}
          {cells.map((d,i)=>d===null?<div key={i}/>:
            <div key={i} style={{minHeight:sel?76:94,border:`1px solid ${C.line}`,borderRadius:9,padding:6,background:inHalf(d)?"#fff":"#F1EDE8",fontSize:11}}>
              <div style={{fontWeight:800,color:C.sub,fontSize:10.5,marginBottom:4}}>{d}</div>
              {assets.filter(a=>{const dd=new Date(a.date);return dd.getDate()===d&&dd.getMonth()===m&&vis(a)}).map(a=>
                <div key={a.id} onClick={()=>setSel(a.id)} title={a.talkingPoint} style={{fontSize:sel?9.5:10.5,fontWeight:600,padding:"3px 6px",borderRadius:6,marginBottom:3,color:"#fff",cursor:"pointer",background:chCls[a.channel],display:"flex",justifyContent:"space-between",gap:4,outline:sel===a.id?`2px solid ${C.navy}`:"none"}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.pname}</span>
                  <span style={{fontSize:8,opacity:.85}}>{a.channel==="WA"?a.aud[0]:a.channel==="PN"?"P":"E"}{a.status==="queued"?"✓":""}</span>
                </div>)}
            </div>)}
        </div>
        <div style={{display:"flex",gap:14,alignItems:"center",marginTop:12,fontSize:11.5,color:C.sub,flexWrap:"wrap"}}>
          {Object.entries(chCls).map(([k,v])=><span key={k}><span style={{width:10,height:10,borderRadius:3,background:v,display:"inline-block",marginRight:5,verticalAlign:"middle"}}/>{chFull[k]}</span>)}
          <span style={{flex:1}}/><span>{assets.filter(vis).length} comms · {assets.filter(a=>a.status==="queued").length} queued</span>
        </div>
      </div>
      {selAsset&&<div style={{maxHeight:"calc(100vh - 120px)",overflow:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <Eyebrow>Idea → brief{selAsset.adhoc?" · ad-hoc":""}</Eyebrow>
          <Btn ghost sm onClick={()=>setSel(null)}>✕ close</Btn>
        </div>
        <Card style={{padding:15,marginBottom:12,borderLeft:`4px solid ${C.coral}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <Eyebrow>Why this comm, this day</Eyebrow>
            <Tag>{selAsset.seqName}{selAsset.seq?" · touch "+selAsset.seq+"/3":""}</Tag>
          </div>
          <div style={{fontWeight:800,fontSize:13.5,margin:"8px 0 4px"}}>“{selAsset.talkingPoint||"—"}”</div>
          {selAsset.hookSrc&&<div style={{fontSize:11.5,fontWeight:700,color:selAsset.altUsed?C.amber:C.green}}>{selAsset.hookSrc}</div>}
          {selAsset.why&&<div style={{background:C.paper,borderRadius:8,padding:"8px 11px",marginTop:8,fontSize:11.5,color:C.sub,lineHeight:1.5}}>{selAsset.why}</div>}
          <Btn ghost sm style={{marginTop:10}} onClick={()=>{
            const p=PRODUCTS.find(x=>x.id===selAsset.pid)||{id:selAsset.pid,category:selAsset.category};
            const alt=suggestAltHook(p,selAsset.talkingPoint,1+Math.floor(Math.random()*97));
            setAssets(assets.map(x=>x.id===selAsset.id?{...x,talkingPoint:alt.hook,hookSrc:"Swapped by you — "+alt.src,altUsed:true}:x));
            setBriefs({...briefs,[selAsset.id]:{...(briefs[selAsset.id]||briefFromAsset(selAsset)),message:alt.hook,angle:alt.hook}});
            toast("New talking point applied — brief updated");
          }}>↻ Suggest new talking point</Btn>
        </Card>
        <Brief asset={selAsset} value={briefs[selAsset.id]||briefFromAsset(selAsset)}
          onChange={v=>setBriefs({...briefs,[selAsset.id]:v})}
          onMoveDate={d=>moveDate(selAsset.id,d)} onLoad={()=>loadBrief(selAsset)}/>
      </div>}
    </div>
  </div>;
}

/* ===== RULE BOOK ===== */
function RuleBook(){
  const S=({t,items})=><Card style={{padding:16,marginBottom:13}}>
    <Eyebrow>{t}</Eyebrow>
    <div style={{marginTop:8}}>{items.map((x,i)=><div key={i} style={{display:"flex",gap:10,padding:"7px 0",borderBottom:i<items.length-1?"1px solid #F1EDE8":"none",fontSize:12.5,lineHeight:1.5}}>
      <span style={{color:C.coral,fontWeight:800}}>{String(i+1).padStart(2,"0")}</span><span>{x}</span></div>)}</div>
  </Card>;
  return <div className="fade">
    <div style={{marginBottom:16}}><H1>Rule book</H1><Sub>The trends and rules every plan, sequence, and communication follows. The calendar engine enforces these automatically.</Sub></div>
    <S t="Portfolio rules" items={[
      "Dog 60% / Cat 40% revenue split is the standing target — the dashboard flags drift.",
      "Category priority is fixed: 1. Food → 2. Treats → 3. Lifestyle. Food earns the front of every fortnight.",
      "Minimum order value ₹699 — offer-led comms should push carts past it, never below.",
      "HUFT-owned brands lead; 3P appears where it defends the basket (RC, Farmina, Sheba anchors)."]}/>
    <S t="Channel rules" items={[
      "Hard monthly caps: 60 WhatsApp · 4 Push · a handful of emails. Fortnight defaults 30 / 2 / 3 — adjustable, never silently exceeded.",
      "PN is scarce: reserved for top-priority SKUs at their highest-intent moment (offer live, lapsed win-back, replenishment due).",
      "Retail comms are WhatsApp-only — no web/app links. D2C can use all channels.",
      "Email carries the deeper Food story (ingredients, proof); WhatsApp is the workhorse; PN is the nudge."]}/>
    <S t="Sequencing & anti-cannibalization" items={[
      "Every product runs a 3-touch arc: Open the story → Prove it → Close/nudge, spaced ~3 days so the ask lands after the proof.",
      "One category per species per day — when we talk food to dog parents, we do not talk treats to them the same day.",
      "Food leads the fortnight; the Treats (reward) story only starts once the bowl conversation has run; Lifestyle rides the tail.",
      "Ad-hoc additions and date moves are checked live — the calendar flags any same-wallet collision."]}/>
    <S t="Talking-point rules" items={[
      "Every talking point carries evidence: proven (repeat it), mixed (keep, watch), or failed (auto-replaced).",
      "A hook that failed does not run again unchanged — the engine swaps in a proven sibling hook or a fresh playbook angle as an A/B.",
      "Campaigns and offers must name the product they belong to; the offer flows into that product's briefs automatically.",
      "Untested angles run small before they run wide."]}/>
    <S t="Seasonal trend map (what each month leans on)" items={MONTHS.map((m,i)=>m+" — "+seasonalNote(i))}/>
  </div>;
}

/* ===== UPLOAD (performance docs & content calendars) ===== */
const DOC_KINDS=["CleverTap performance report","Content calendar (last 6 months)","Retail comms log","Other"];
function UploadTab(){
  const [file,setFile]=useState(null),[rows,setRows]=useState(null),[kind,setKind]=useState(DOC_KINDS[0]);
  const [desc,setDesc]=useState(""),[insights,setInsights]=useState(null),[busy,setBusy]=useState(false),[done,setDone]=useState(false);
  const inp=useRef();
  function handle(f){if(!f)return;setFile(f);setInsights(null);setDone(false);setRows(null);
    if(/\.csv$/i.test(f.name))Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>setRows(r.data)});}
  async function extract(){
    setBusy(true);const ins=[];
    if(rows&&rows.length){
      const cols=Object.keys(rows[0]);
      ins.push({t:"Structure",d:`${rows.length} rows · columns: ${cols.slice(0,8).join(", ")}${cols.length>8?"…":""}`});
      const rc=cols.find(c=>/rev/i.test(c)),nc=cols.find(c=>/campaign|name|asset|title|comm/i.test(c)),cc=cols.find(c=>/channel/i.test(c)),tc=cols.find(c=>/ctr|click/i.test(c)),ac=cols.find(c=>/aud|type|d2c|retail/i.test(c));
      if(rc&&nc){const top=[...rows].sort((a,b)=>(parseFloat(b[rc])||0)-(parseFloat(a[rc])||0))[0];ins.push({t:"Top performer",d:`“${top[nc]}” — ₹${(parseFloat(top[rc])||0).toLocaleString("en-IN")} revenue`});}
      if(tc){const v=rows.map(r=>parseFloat(r[tc])||0);ins.push({t:"CTR read",d:`Average ${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)}% · best ${Math.max(...v).toFixed(2)}%`});}
      if(cc){const by={};rows.forEach(r=>{by[r[cc]||"—"]=(by[r[cc]||"—"]||0)+1});ins.push({t:"Channel mix",d:Object.entries(by).map(([k,v])=>k+": "+v).join(" · ")});}
      if(ac){const by={};rows.forEach(r=>{by[r[ac]||"—"]=(by[r[ac]||"—"]||0)+1});ins.push({t:"D2C vs Retail in this doc",d:Object.entries(by).map(([k,v])=>k+": "+v).join(" · ")});}
    }else if(file){ins.push({t:"File noted",d:`“${file.name}” isn't a CSV — export the sheet as CSV for structured extraction. Logged with your note for review.`});}
    const ai=await askAI(`You are the HUFT CRM strategy engine. Uploaded: ${kind}. User note: "${desc||"none"}". Extracted stats: ${ins.map(x=>x.t+": "+x.d).join(" | ")}. Give exactly 3 short, sharp insights and 1 recommended action for next fortnight's CRM plan. Plain text, no markdown.`);
    ins.push(ai?{t:"AI read",d:ai}:{t:"AI read",d:"AI key not set — rule-based extraction shown. Add a key from the sidebar (⚙ AI key) for narrative insights."});
    setInsights(ins);setBusy(false);
  }
  return <div className="fade">
    <div style={{marginBottom:16}}><H1>Upload</H1><Sub>Upload performance documents or content calendars. Say what the document is — the engine pulls the right insights and shows them before ingest.</Sub></div>
    <Card style={{padding:14,marginBottom:14,borderLeft:`4px solid ${C.green}`}}>
      <Eyebrow color={C.green}>Already ingested</Eyebrow>
      <div style={{fontSize:12.5,marginTop:5}}>Your <b>6 monthly content calendars (Jan–Jun 2026)</b> are loaded — <b>{NUM(CAL.totalSends)} CRM sends</b>, {NUM(CAL.totalSent)} messages. Feeding Dashboard channel reach, top audiences, and the CRM-push evidence in Sales × Performance.</div>
    </Card>
    <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:10}}>
      {DOC_KINDS.map(k=><Chip key={k} label={k} active={kind===k} onClick={()=>setKind(k)}/>)}
    </div>
    <Inp placeholder="What is this document for? — e.g. “June CleverTap export, all WA campaigns” or “Retail calendar Feb–Jun with delivery numbers”" value={desc} onChange={e=>setDesc(e.target.value)} style={{marginBottom:12}}/>
    <input ref={inp} type="file" accept=".csv,.xlsx,.pdf" style={{display:"none"}} onChange={e=>handle(e.target.files[0])}/>
    <div onClick={()=>inp.current.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handle(e.dataTransfer.files[0])}}
      style={{border:"2px dashed #F4C7AC",background:C.coralSoft+"66",borderRadius:14,padding:32,textAlign:"center",cursor:"pointer"}}>
      <div style={{fontSize:28}}>📤</div><div style={{fontWeight:800,marginTop:8}}>Drop the document, or click to browse</div>
      <Sub>{file?file.name+(rows?` · ${rows.length} rows parsed`:""):"CSV parses fully; xlsx/pdf are logged for review (export sheets as CSV for full extraction)"}</Sub>
    </div>
    <div style={{display:"flex",gap:10,marginTop:12,alignItems:"center"}}>
      <Btn disabled={!file||busy} onClick={extract}>{busy?"Reading…":"Extract insights"}</Btn>
      {insights&&!done&&<Btn dark onClick={()=>{setDone(true)}}>Looks right — ingest</Btn>}
      {done&&<span style={{fontSize:12,fontWeight:800,color:C.green}}>Ingested — feeding Sales × Performance and talking-point evidence.</span>}
    </div>
    {insights&&<div style={{marginTop:14,display:"grid",gap:10}}>
      {insights.map((x,i)=><Card key={i} style={{padding:14,borderLeft:`4px solid ${x.t==="AI read"?C.purple:C.teal}`}}>
        <Eyebrow color={x.t==="AI read"?C.purple:C.teal}>{x.t}</Eyebrow>
        <div style={{fontSize:12.5,marginTop:5,whiteSpace:"pre-wrap",lineHeight:1.55}}>{x.d}</div>
      </Card>)}
    </div>}
  </div>;
}

/* ===== APP ===== */
function App(){
  const [tab,setTab]=useState("dashboard");
  const [period,setPeriod]=useState("m6");
  const [cohorts,setCohorts]=useState(COHORTS);
  const [customs,setCustoms]=useState([]);
  const [fp,setFp]=useState({year:2026,month:6,half:"H1"});
  const [focus,setFocus]=useState(()=>{
    const huft=PRODUCTS.filter(p=>p.owner==="HUFT");
    const top3p=PRODUCTS.filter(p=>p.owner==="3P").sort((a,b)=>b.rev-a.rev).slice(0,10);
    return [...huft,...top3p].map(p=>({pid:p.id,goal:Math.round(p.monthly[String(LATEST)].rev*1.15/1000)*1000}));
  });
  const [choices,setChoices]=useState({});
  const [caps,setCaps]=useState({WA:30,PN:2,Email:3});
  const [locked,setLocked]=useState(false);
  const [calAssets,setCalAssets]=useState([]);
  const [briefs,setBriefs]=useState({});
  const [campaigns,setCampaigns]=useState([]);
  const [toastMsg,setToast]=useState("");
  const toast=m=>{setToast(m);setTimeout(()=>setToast(""),2600)};
  function lock(){const gen=buildCalendar(focus,choices,fp,caps,cohorts,customs,campaigns);setCalAssets(gen);setLocked(true);setTab("calendar");toast(`Calendar built · ${gen.length} priority comms`);}
  const NAV=[["dashboard","Dashboard"],["catalog","Catalog"],["cohorts","Cohorts"],["perf","Sales × Performance"],["priority","Priorities"],["strategy","Strategy"],["calendar","Calendar"],["rules","Rule book"],["import","Upload"]];
  const IC={dashboard:"M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z",catalog:"M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z",cohorts:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75",perf:"M4 19V5m5 14V9m5 10v-6m5 6V7",priority:"M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21 8 14 2 9.4h7.6L12 2z",strategy:"M12 3v18M5 8l7-5 7 5M5 8v8l7 5 7-5V8",calendar:"M7 3v3m10-3v3M4 8h16M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z",import:"M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2",rules:"M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"};
  return <div style={{display:"flex",minHeight:"100vh"}}>
    <div style={{width:230,flexShrink:0,background:C.navy,color:"#fff",position:"sticky",top:0,height:"100vh",display:"flex",flexDirection:"column",boxShadow:"2px 0 14px rgba(0,0,0,.14)",zIndex:30}}>
      <div style={{padding:"18px 16px 16px",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid rgba(255,255,255,.08)"}}>
        <div style={{width:34,height:34,borderRadius:9,background:C.coral,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l1.9 5.8L19.7 8l-4.7 3.5 1.8 5.8L12 13.9 7.2 17.3l1.8-5.8L4.3 8l5.8-.2L12 2z"/></svg>
        </div>
        <div style={{lineHeight:1.15,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:15,letterSpacing:-.3}}>CRM Strategy</div>
          <div title={BUILD} style={{fontSize:10,fontWeight:800,color:"rgba(255,255,255,.55)",letterSpacing:.3,whiteSpace:"nowrap"}}>{BUILD} · Shopify 6mo</div>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"12px 10px",display:"flex",flexDirection:"column",gap:3}}>
        {NAV.map(([k,l])=>{const on=tab===k;return<button key={k} onClick={()=>setTab(k)} style={{display:"flex",alignItems:"center",gap:11,padding:"10px 12px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13.5,fontWeight:600,width:"100%",textAlign:"left",background:on?C.coral:"transparent",color:on?"#fff":"rgba(255,255,255,.62)",transition:"all .15s"}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={IC[k]}/></svg>
          <span style={{flex:1}}>{l}</span></button>})}
      </div>
      <div style={{padding:"10px 12px 14px",borderTop:"1px solid rgba(255,255,255,.08)",display:"flex",flexDirection:"column",gap:8}}>
        <button onClick={()=>{const k=window.prompt("Paste your Anthropic API key (stored only in this browser). Leave empty to clear:",AI_KEY||"");if(k!==null){AI_KEY=k.trim();try{localStorage.setItem("strat_ai_key",AI_KEY)}catch(e){}}}} style={{display:"flex",alignItems:"center",gap:8,border:"1px solid rgba(255,255,255,.14)",borderRadius:9,padding:"8px 11px",fontWeight:700,background:"rgba(255,255,255,.04)",color:AI_KEY?"#7EE0B0":"rgba(255,255,255,.62)",fontSize:11.5,textAlign:"left",cursor:"pointer"}}>
          <span style={{width:7,height:7,borderRadius:99,background:AI_KEY?C.green:"rgba(255,255,255,.4)"}}/> AI key {AI_KEY?"· connected":"· add for insights"}</button>
      </div>
    </div>
    <div style={{flex:1,minWidth:0,padding:"24px 26px 80px",maxWidth:1220}}>
      {tab==="dashboard"&&<Dashboard period={period} setPeriod={setPeriod}/>}
      {tab==="catalog"&&<CatalogTab cohorts={cohorts} setCohorts={setCohorts}/>}
      {tab==="cohorts"&&<CohortsTab cohorts={cohorts} setCohorts={setCohorts}/>}
      {tab==="perf"&&<SalesPerformance period={period} setPeriod={setPeriod} cohorts={cohorts}/>}
      {tab==="priority"&&<Priorities focus={focus} setFocus={setFocus} fp={fp} setFp={setFp} customs={customs} setCustoms={setCustoms} cohorts={cohorts}/>}
      {tab==="strategy"&&<Strategy focus={focus} setFocus={setFocus} choices={choices} setChoices={setChoices} fp={fp} caps={caps} setCaps={setCaps} onLock={lock} locked={locked} cohorts={cohorts} setCohorts={setCohorts} customs={customs} campaigns={campaigns} setCampaigns={setCampaigns}/>}
      {tab==="calendar"&&(locked?<CalendarView assets={calAssets} setAssets={setCalAssets} fp={fp} briefs={briefs} setBriefs={setBriefs} toast={toast} caps={caps} onRebuild={lock} cohorts={cohorts}/>
        :<div style={{textAlign:"center",padding:50,color:C.sub}}>No calendar yet.<br/><Btn style={{marginTop:14}} onClick={()=>setTab("strategy")}>Go to Strategy to lock priorities →</Btn></div>)}
      {tab==="rules"&&<RuleBook/>}
      {tab==="import"&&<UploadTab/>}
    </div>
    {toastMsg&&<div style={{position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",background:C.navy,color:"#fff",padding:"12px 18px",borderRadius:12,fontSize:12.5,fontWeight:700,boxShadow:"0 10px 30px rgba(0,0,0,.25)",zIndex:90}}>{toastMsg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
