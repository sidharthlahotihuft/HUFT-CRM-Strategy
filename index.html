<title>HUFT CRM Strategy</title>
<!--
  HUFT CRM Strategy Engine
  BUILD: STRAT-1.0.0
  Single-file React (UMD + Babel), no build step. Deploy to Vercel as index.html.
  Family: sits alongside CRM Creative (live) + Sales Insight Engine. HUFT brand (Sweet Orange #FF6D1F, Rubik).

  DATA CONTRACT (swap-to-real):
    USE_MOCK=true  -> uses embedded mock built on the REAL HUFT catalog + real cohort brief grid.
    USE_MOCK=false -> wire the fetchers in the DATA LAYER section to named Supabase RPCs / MySQL views:
        fetchSales(period)      -> rpc('strategy_sales_by_product', {period})
        fetchAffinity()         -> rpc('strategy_combo_affinity')          (2-3 product co-purchase)
        fetchAssets(period)     -> rpc('strategy_asset_performance', {period})  (CleverTap-fed)
    Order shape mirrors the CleverTap "Charged" event: per line-item Product Name, category(=product.type),
    item_price, brand(=vendor), product_url, image_url, cookie_id(=sku), tags, Quantity, RP_date.
-->

<script>
/* on-page error reporter: if the app throws (or Babel fails to compile), show it instead of a blank page */
(function(){
  function show(msg){
    var r=document.getElementById('root');
    var html='<div style="font:13px/1.6 ui-monospace,Menlo,monospace;color:#8a1020;background:#fff4f4;border:1px solid #f2c2c2;padding:16px 18px;margin:16px;border-radius:10px;white-space:pre-wrap;word-break:break-word">'
      +'<b>App error — this is why the screen was blank:</b>\n\n'+String(msg)+'</div>';
    if(r){ r.innerHTML=html; } else { document.addEventListener('DOMContentLoaded',function(){var rr=document.getElementById('root'); if(rr) rr.innerHTML=html;}); }
  }
  window.addEventListener('error',function(e){
    show((e.message||'Error')+(e.filename?('\n'+String(e.filename).split('/').pop()+':'+e.lineno+':'+e.colno):'')+(e.error&&e.error.stack?('\n\n'+e.error.stack):''));
  });
  window.addEventListener('unhandledrejection',function(e){ show('Unhandled promise rejection:\n'+((e.reason&&e.reason.stack)||e.reason)); });
  var _ce=console.error;
  console.error=function(){
    try{ var r=document.getElementById('root');
      if(r && !r.childElementCount){
        var m=Array.prototype.map.call(arguments,function(a){return (a&&a.stack)||(typeof a==='object'?JSON.stringify(a):String(a));}).join(' ');
        if(m) show(m);
      }
    }catch(_){}
    return _ce.apply(console,arguments);
  };
})();
</script>
<style>
  :root{
    --orange:#FF6D1F; --orange-soft:#FFF1E8; --orange-line:#FFD9C2;
    --teal:#0E8C82; --teal-soft:#E4F4F2;               /* Cat accent, complements orange */
    --ink:#1A1512; --muted:#8B817A; --faint:#B7ADA4;
    --paper:#FBF8F4; --card:#FFFFFF; --line:#ECE4DA; --line-2:#F4EEE6;
    --good:#1E9E6A; --good-soft:#E6F5EE; --warn:#C77D12; --warn-soft:#FBF0DE; --bad:#D14343; --bad-soft:#FBE9E9;
    --shadow:0 1px 2px rgba(26,21,18,.05),0 6px 20px rgba(26,21,18,.05);
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #root{min-height:100vh}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--orange-line)}

  /* shell */
  .top{position:sticky;top:0;z-index:40;background:rgba(251,248,244,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em;font-size:16px}
  .paw{width:30px;height:30px;border-radius:9px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(255,109,31,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:-1px}
  .build{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-weight:600;letter-spacing:.03em}
  .spacer{flex:1}
  .period{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .period button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:8px;white-space:nowrap}
  .period button.on{background:var(--ink);color:#fff}

  .nav{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
  .nav button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:14px 15px;position:relative;white-space:nowrap}
  .nav button.on{color:var(--ink)}
  .nav button.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--orange);border-radius:3px}

  .wrap{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
  .subnav{display:flex;gap:7px;margin-bottom:22px;flex-wrap:wrap}
  .subnav button{border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13px;padding:8px 14px;border-radius:20px}
  .subnav button.on{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange)}

  /* type */
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .grid{display:grid;gap:14px}
  .row{display:flex;gap:14px;flex-wrap:wrap}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--line-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .chip.dog{background:var(--orange-soft);color:#C4531A;border-color:var(--orange-line)}
  .chip.cat{background:var(--teal-soft);color:var(--teal);border-color:#BFE6E1}
  .chip.life{background:#F0ECFB;color:#6B54B8;border-color:#DED3F5}
  .chip.food{background:#EAF3EC;color:#2E7D4F;border-color:#CFE6D6}
  .chip.treats{background:#FBF0DE;color:#9A6410;border-color:#F0DDBB}
  .chip.offer{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.p3{background:#EEF1F4;color:#556;border-color:#DDE3E9}
  .chip.mov{background:var(--good-soft);color:var(--good);border-color:#C6E9D6}

  .delta{font-weight:700;font-size:12.5px}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}

  /* catalog */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(26,21,18,.10)}
  .thumb{height:112px;display:grid;place-items:center;font-weight:800;font-size:30px;color:#fff;letter-spacing:-.02em;position:relative}
  .thumb .own{position:absolute;top:8px;right:8px}
  .tile-b{padding:12px 13px 14px}
  .tile-b .nm{font-weight:700;font-size:13.5px;letter-spacing:-.01em;line-height:1.25}
  .tile-b .br{color:var(--muted);font-size:11.5px;font-weight:500;margin-top:1px}
  .tile-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
  .brandhdr{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
  .brandhdr h2{font-size:16px} .brandhdr .cnt{color:var(--faint);font-size:12px;font-weight:600}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(26,21,18,.34);z-index:60;display:flex;justify-content:flex-end}
  .drawer{width:min(460px,94vw);background:var(--paper);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .drawer-top{height:130px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:40px;position:relative}
  .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9px;border:0;background:rgba(255,255,255,.9);font-size:16px;font-weight:700}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .kv .k{color:var(--muted)} .kv .v{font-weight:600;text-align:right;max-width:60%;word-break:break-word}
  .cohort{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin-bottom:9px;background:var(--card)}
  .cohort .cn{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.05em;text-transform:uppercase}
  .cohort .tg{font-size:12.5px;color:var(--muted);margin:5px 0 8px;line-height:1.4}
  .cohort .hk{font-weight:600;font-size:13.5px;line-height:1.35}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 3px}
  .kpi .cmp{font-size:11.5px;color:var(--faint);font-weight:500}

  /* bars */
  .barrow{display:flex;align-items:center;gap:12px;margin:9px 0}
  .barrow .nm{width:150px;font-size:13px;font-weight:600;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{flex:1;height:22px;background:var(--line-2);border-radius:7px;overflow:hidden}
  .barfill{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700}
  .barval{width:96px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0}

  .split{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .split div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .target-note{font-size:12px;color:var(--muted);margin-top:8px}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  th.r,td.r{text-align:right}
  .rank{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}

  /* verdict */
  .verdict{font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:20px}
  .v-good{background:var(--good-soft);color:var(--good)} .v-watch{background:var(--warn-soft);color:var(--warn)} .v-bad{background:var(--bad-soft);color:var(--bad)}

  /* strategy briefs */
  .brief{border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:var(--r-sm);padding:14px;background:var(--card)}
  .brief.cat{border-left-color:var(--teal)}
  .brief .bt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .brief h3{margin:0;font-size:14.5px;font-weight:700}
  .brief .why{font-size:12px;color:var(--muted);margin:3px 0 0}
  .brief .hkq{font-weight:600;font-size:14px;margin:11px 0 0;padding:9px 11px;background:var(--orange-soft);border-radius:8px;line-height:1.35}
  .brief.cat .hkq{background:var(--teal-soft)}
  .brief .rec{font-size:12px;margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:4px 0}
  .day{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--card);font-size:11px}
  .day.empty{background:transparent;border:0}
  .day .dn{font-weight:700;color:var(--muted);font-size:11px;margin-bottom:4px}
  .send{font-size:10.5px;font-weight:600;padding:2px 5px;border-radius:5px;margin-bottom:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .send.wa{background:#25946b} .send.pn{background:#3b6fd4} .send.em{background:#b6602a}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:14px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

  .toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);user-select:none}
  .toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .drop{border:2px dashed var(--orange-line);background:var(--orange-soft);border-radius:var(--r);padding:38px;text-align:center;cursor:pointer;transition:background .15s}
  .drop:hover{background:#FFE9DA}
  .drop .ic{font-size:34px}
  .btn{border:0;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.dark{background:var(--ink)}
  .note{font-size:12px;color:var(--muted);line-height:1.5}
  .pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .search{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font-size:13px;font-family:inherit;width:230px;color:var(--ink)}
  .search:focus{outline:none;border-color:var(--orange-line)}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:13.5px}
  @media(max-width:640px){.barrow .nm{width:96px}.wrap{padding:20px 14px 70px}.top-in{padding:10px 14px}.nav{padding:0 14px}}
</style>

function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)}
function rnd(str){return (seed(str)%10000)/10000}

// deterministic mock sales per product for the three windows
function mockSales(){
  return CATALOG.map(p=>{
    const catBase = p.category==="Food"?1400 : p.category==="Treats"?800 : 500;
    const own = p.owner==="3P"?0.5:1;
    const emptyPenalty = p.cohorts.length? 1 : 0.55; // un-briefed SKUs sell softer in mock
    const unitsLM = Math.round((catBase*(0.4+rnd(p.id)*1.4))*own*emptyPenalty);
    const unitsLY = Math.round(unitsLM*(0.68+rnd(p.id+"ly")*0.30));
    const unitsTQ = Math.round(unitsLM*(2.7+rnd(p.id+"tq")*0.7));
    const d2cShare = 0.55+rnd(p.id+"ch")*0.30;
    return {...p,
      lm:{units:unitsLM, rev:unitsLM*p.price},
      ly:{units:unitsLY, rev:unitsLY*p.price},
      tq:{units:unitsTQ, rev:unitsTQ*p.price},
      d2cShare};
  });
}

/* ---- live fetchers (USE_MOCK=false). Endpoint paths mirror Supabase RPC convention. ---- */
async function rpc(name){
  const r = await fetch(`${API_BASE}/rest/v1/rpc/${name}`);
  if(!r.ok) throw new Error(name+" "+r.status);
  return r.json();
}
// API returns per-node {id, lm:{units,rev}, ly:{...}, tq:{...}, d2cShare?}; join to CATALOG for name/brand/cohorts.
async function fetchSales(){
  const rows = await rpc("strategy_sales_by_product");
  const byId = {}; rows.forEach(x=>byId[x.id]=x);
  return CATALOG.map(p=>{
    const s = byId[p.id]||{};
    const z = {units:0,rev:0};
    return {...p, lm:s.lm||z, ly:s.ly||z, tq:s.tq||z, d2cShare:(s.d2cShare!=null?s.d2cShare:0.6)};
  });
}
async function fetchAffinity(){
  const rows = await rpc("strategy_combo_affinity"); // [{items:[id..], name, size, lift, push, why}]
  return rows;
}
async function loadData(){
  if(USE_MOCK) return {ok:true};
  const [sales, aff] = await Promise.all([fetchSales(), fetchAffinity().catch(()=>AFFINITY)]);
  SALES = sales; AFFINITY = aff;                     // ASSETS stays CleverTap-CSV-fed (Upload tab)
  return {ok:true};
}

/* ============================ SALES INSIGHTS ============================ */
function SalesInsights({period}){
  const cmp = cmpKey(period);
  const tot = SALES.reduce((a,r)=>({rev:a.rev+P(r,period).rev, units:a.units+P(r,period).units}),{rev:0,units:0});
  const totC = SALES.reduce((a,r)=>({rev:a.rev+P(r,cmp).rev, units:a.units+P(r,cmp).units}),{rev:0,units:0});
  const orders = Math.round(tot.units/2.3), ordersC = Math.round(totC.units/2.3);
  const aov = tot.rev/Math.max(1,orders), aovC = totC.rev/Math.max(1,ordersC);
  const dRev=pct(tot.rev,totC.rev), dU=pct(tot.units,totC.units), dO=pct(orders,ordersC), dA=pct(aov,aovC);
  const cmpLabel = PERIODS.find(x=>x.k===cmp).l;

  const bySpecies = ["Dog","Cat","Lifestyle"].map(s=>({s,rev:SALES.filter(r=>r.species===s).reduce((a,r)=>a+P(r,period).rev,0)}));
  const speciesTot = bySpecies.reduce((a,b)=>a+b.rev,0);
  const dogPct = Math.round(bySpecies[0].rev/speciesTot*100), catPct=Math.round(bySpecies[1].rev/speciesTot*100), lifePct=100-dogPct-catPct;

  const byCat = ["Food","Treats","Lifestyle"].map(c=>({c,rev:SALES.filter(r=>r.category===c).reduce((a,r)=>a+P(r,period).rev,0)}));
  const catMax = Math.max(...byCat.map(x=>x.rev));

  const top = [...SALES].sort((a,b)=>P(b,period).rev-P(a,period).rev).slice(0,8);
  const d2cRev = SALES.reduce((a,r)=>a+P(r,period).rev*r.d2cShare,0);
  const d2cPct = Math.round(d2cRev/tot.rev*100);

  const Kpi=({lab,val,d})=><div className="card pad kpi">
    <div className="lab">{lab}</div><div className="big">{val}</div>
    <div className="cmp"><span className={"delta "+d.cls}>{d.t}</span> vs {cmpLabel}</div>
  </div>;

  return <div>
    <div className="kpis" style={{marginBottom:16}}>
      <Kpi lab="Revenue" val={K(tot.rev)} d={dRev}/>
      <Kpi lab="Orders" val={orders.toLocaleString("en-IN")} d={dO}/>
      <Kpi lab="Units" val={tot.units.toLocaleString("en-IN")} d={dU}/>
      <Kpi lab="AOV" val={INR(aov)} d={dA}/>
    </div>
    <div className="row" style={{alignItems:"stretch"}}>
      <div className="card pad" style={{flex:"1 1 340px"}}>
        <div className="eyebrow">Dog vs Cat mix</div><h2 style={{marginTop:4}}>Revenue share this period</h2>
        <div className="split" style={{marginTop:14}}>
          <div style={{width:dogPct+"%",background:"#FF6D1F"}}>{dogPct>8?`Dog ${dogPct}%`:""}</div>
          <div style={{width:catPct+"%",background:"#0E8C82"}}>{catPct>8?`Cat ${catPct}%`:""}</div>
          <div style={{width:lifePct+"%",background:"#6B54B8"}}>{lifePct>8?`${lifePct}%`:""}</div>
        </div>
        <div className="target-note">Strategy target is <b>Dog 60 / Cat 40</b>. Current Dog {dogPct}% · Cat {catPct}% {dogPct>62?"— dog over-indexed, rebalance toward cat.":dogPct<58?"— dog under target, push priority dog SKUs.":"— on target."}</div>
      </div>
      <div className="card pad" style={{flex:"1 1 300px"}}>
        <div className="eyebrow">Channel</div><h2 style={{marginTop:4}}>D2C vs Retail</h2>
        <div className="split" style={{marginTop:14}}>
          <div style={{width:d2cPct+"%",background:"#1A1512"}}>D2C {d2cPct}%</div>
          <div style={{width:(100-d2cPct)+"%",background:"#B7ADA4"}}>Retail {100-d2cPct}%</div>
        </div>
        <div className="target-note">Channel derived from order payload <code>Channel</code> field. Retail split feeds the calendar D2C/Retail filter.</div>
      </div>
    </div>
    <div className="card pad" style={{marginTop:14}}>
      <div className="eyebrow">Category mix</div><h2 style={{marginTop:4,marginBottom:12}}>Revenue by category priority</h2>
      {byCat.map((x,i)=><div className="barrow" key={x.c}>
        <div className="nm">{i+1}. {x.c}</div>
        <div className="bartrack"><div className="barfill" style={{width:Math.max(6,x.rev/catMax*100)+"%",background:i===0?"#FF6D1F":i===1?"#C77D12":"#6B54B8"}}></div></div>
        <div className="barval">{K(x.rev)}</div>

/* ============================ PRIORITIES ============================ */
const CAT_WEIGHT = {Food:3, Treats:2, Lifestyle:1};
const SPECIES_WEIGHT = {Dog:0.60, Cat:0.40, Lifestyle:0.15};
function priorityScore(row,period){
  const rev = P(row,period).rev;
  const revScore = Math.log10(rev+10);                 // dampen scale
  const briefReady = row.cohorts.length? 1.2 : 0.6;
  return revScore * CAT_WEIGHT[row.category] * (SPECIES_WEIGHT[row.species]||0.15) * briefReady * (row.owner==="HUFT"?1.15:0.8);
}
function Priorities({period}){
  const ranked = [...SALES].filter(r=>r.owner==="HUFT").map(r=>({...r,score:priorityScore(r,period)})).sort((a,b)=>b.score-a.score).slice(0,14);
  return <div>
    <div className="card pad" style={{marginBottom:16}}>
      <div className="eyebrow">Prioritisation rules</div><h2 style={{marginTop:4,marginBottom:10}}>What ranks a SKU</h2>

      </div>
      <p className="note" style={{marginTop:10}}>Rank = revenue (log) × category weight (Food 3 / Treats 2 / Lifestyle 1) × species weight (Dog .60 / Cat .40) × brief-readiness × ownership. Un-briefed SKUs are penalised so Strategy surfaces the gap.</p>
    </div>
    <div className="card">
      <div className="pad" style={{paddingBottom:6}}><h2>Priority order · {PERIODS.find(x=>x.k===period).l}</h2></div>
      <div style={{padding:"0 8px 8px"}}><table>
        <thead><tr><th>#</th><th>Product</th><th>Species</th><th>Category</th><th className="r">Revenue</th><th>Readiness</th></tr></thead>
        <tbody>{ranked.map((r,i)=><tr key={r.id}>
          <td><span className="rank">{i+1}</span></td>
          <td><b>{r.name}</b> <span style={{color:"var(--muted)",fontSize:11.5}}>· {r.brand}</span></td>
          <td>{speciesChip(r.species)}</td>

          <td className="r"><b>{K(P(r,period).rev)}</b></td>
          <td>{r.cohorts.length? <span className="verdict v-good">{r.cohorts.length} briefs</span> : <span className="verdict v-bad">un-briefed</span>}</td>
        </tr>)}</tbody>
      </table></div>
    </div>
  </div>;
}

/* ============================ STRATEGY ============================ */
function buildPlan(period, assets){
  // rank HUFT SKUs, respect Dog 60 / Cat 40 and category priority, prefer offer-led cohorts, fold in retrospective
  const perf = {}; assets.forEach(a=>{perf[a.pid]=perf[a.pid]||[]; perf[a.pid].push(a)});
  const pool = SALES.filter(r=>r.owner==="HUFT"&&r.cohorts.length>0).map(r=>({...r,score:priorityScore(r,period)})).sort((a,b)=>b.score-a.score);
  const target = {Dog:6, Cat:4};                       // 60/40 across a 10-slot plan
  const picked = {Dog:0, Cat:0}; const plan=[];
  const catOrder={Food:0,Treats:1,Lifestyle:2};
  pool.sort((a,b)=> (catOrder[a.category]-catOrder[b.category]) || (b.score-a.score));
  for(const r of pool){
    if(r.species==="Lifestyle") continue;
    if(picked[r.species]>=target[r.species]) continue;
    const past = perf[r.id];
    const worked = past && past.some(x=>x.verdict==="good");
    const failed = past && past.every(x=>x.verdict==="bad");
    // choose cohort: repeat a winner, otherwise prefer offer-led, else cohort 1
    let cohort;
    if(worked){ const w=past.find(x=>x.verdict==="good"); cohort=r.cohorts[w.cohortN-1]||r.cohorts[0]; }
    else { cohort = r.cohorts.find(c=>c.offer) || r.cohorts[0]; }
    plan.push({...r, cohort, worked, failed, past});
    picked[r.species]++;
    if(picked.Dog>=target.Dog&&picked.Cat>=target.Cat) break;
  }
  return plan;
}
function Strategy({period}){
  const assets = ASSETS;
  const plan = useMemo(()=>buildPlan(period,assets),[period,assets]);
  const wins = assets.filter(a=>a.verdict==="good").sort((a,b)=>b.rev-a.rev);
  const flops = assets.filter(a=>a.verdict==="bad").sort((a,b)=>a.conv-b.conv);
  return <div>
    <h1>Strategy</h1>
    <p className="sub">Data-driven monthly plan. Respects the split + category priority, prefers offer-led cohorts, and folds in what worked last month.</p>

    <div className="card pad" style={{marginBottom:18}}>

      </div>
      <div className="row" style={{gap:8,marginTop:8}}>

      <p className="note" style={{marginTop:10}}>Food sub-priority — <b>Edible-Dog:</b> SWF, Hearty (Kibble/Gravy), NutriWag (Wet/Dry) · <b>Edible-Cat:</b> Meowsi (Food/Treats), NutriMeow (Wet/Dry), Litter-Meowsi.</p>
    </div>

    <div className="row" style={{marginBottom:8}}>
      <div className="eyebrow" style={{flex:1}}>This month's plan · {plan.filter(p=>p.species==="Dog").length} dog / {plan.filter(p=>p.species==="Cat").length} cat</div>
    </div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",marginBottom:22}}>
      {plan.map((p,i)=><div className={"brief "+(p.species==="Cat"?"cat":"")} key={p.id}>
        <div className="bt">
          <div><h3>{i+1}. {p.name}</h3><div className="why">{p.brand} · Cohort {p.cohort.n}</div></div>
          {speciesChip(p.species)}
        </div>
        <div className="why" style={{marginTop:8}}>{p.cohort.target}</div>
        <div className="hkq">“{p.cohort.hook}”</div>
        <div className="rec">
          {catChip(p.category)}
          {p.cohort.offer && <span className="chip offer">offer-led</span>}
          {p.price>=699 && <span className="chip mov">MOV ✓</span>}
          {p.worked && <span className="verdict v-good">↻ repeat winner</span>}
          {p.failed && <span className="verdict v-watch">⚠ reworked hook</span>}
        </div>
      </div>)}
    </div>

    <div className="row" style={{alignItems:"stretch"}}>
      <div className="card pad" style={{flex:"1 1 340px"}}>
        <div className="eyebrow" style={{color:"var(--good)"}}>What worked</div><h2 style={{marginTop:4,marginBottom:10}}>Repeat these</h2>
        {wins.length===0&&<div className="note">No clear winners in the current asset set.</div>}
        {wins.map(a=><div key={a.id} style={{padding:"9px 0",borderBottom:"1px solid var(--line-2)"}}>
          <div className="row" style={{justifyContent:"space-between",alignItems:"center"}}>
            <b style={{fontSize:13.5}}>{a.name}</b><span className="verdict v-good">CTR {a.ctr.toFixed(1)}% · conv {a.conv.toFixed(1)}%</span>

          </div>
          <div className="note" style={{marginTop:3}}>{a.ch} · {a.aud} · cohort {a.cohortN} — {a.offer?"offer didn't move it, try a new angle":"add an offer or switch cohort"}</div>

}

const SAMPLE_CSV = `campaign,product_sku,cohort,channel,audience,sent,ctr,conversion,revenue
SWF Cohort3 Offer,SWF-FOOD,3,WA,D2C,42000,6.2,2.4,241000
Hearty Dry Premium,HEART-DRY,1,Email,D2C,28000,5.1,2.1,187000
Nutrimeow Switch,NMEOW-DRY,2,WA,D2C,31000,3.9,1.6,92000`;
function Upload({onIngest}){
  const [rows,setRows]=useState(null); const [err,setErr]=useState(""); const [name,setName]=useState("");
  const inp=useRef();
  function handle(file){
    if(!file)return; setName(file.name); setErr("");
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>{
      if(!r.data||!r.data.length){setErr("No rows found in that file.");return;}
      setRows(r.data);
    },error:e=>setErr("Couldn't read that file — check it's a CSV export.")});
  }
  function ingest(){
    const mapped=rows.map((r,i)=>{
      const p=CATALOG.find(x=>x.sku===(r.product_sku||"").trim())||{};
      const ctr=parseFloat(r.ctr)||0, conv=parseFloat(r.conversion)||0;
      const verdict=ctr>4.5&&conv>1.8?"good":(ctr<2.6||conv<1.0?"bad":"watch");
      return {id:"up"+i, pid:p.id, name:p.name||r.product_sku||r.campaign, species:p.species, category:p.category,
        cohortN:parseInt(r.cohort)||1, ch:r.channel||"—", aud:r.audience||"—",
        hook:(p.cohorts&&p.cohorts[(parseInt(r.cohort)||1)-1]?p.cohorts[(parseInt(r.cohort)||1)-1].hook:r.campaign||"—"),
        sent:parseInt(r.sent)||0, ctr, conv, rev:parseInt(r.revenue)||0, verdict, offer:true};
    });
    onIngest(mapped); setRows(null); setName("");
    alert(mapped.length+" campaigns ingested → now visible in Assets and folded into Strategy.");
  }
  function sample(){const blob=new Blob([SAMPLE_CSV],{type:"text/csv"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="clevertap_sample.csv";a.click();URL.revokeObjectURL(u);}
  return <div>
    <h1>Upload CleverTap report</h1>
    <p className="sub">Drop a campaign export. It maps SKU → catalog, computes a verdict, and feeds Assets + the Strategy retrospective.</p>
    <input ref={inp} type="file" accept=".csv" style={{display:"none"}} onChange={e=>handle(e.target.files[0])}/>
    <div className="drop" onClick={()=>inp.current.click()}
      onDragOver={e=>{e.preventDefault()}} onDrop={e=>{e.preventDefault();handle(e.dataTransfer.files[0])}}>
      <div className="ic">📤</div>
      <div style={{fontWeight:700,marginTop:8}}>Drop CleverTap CSV here, or click to browse</div>
      <div className="note" style={{marginTop:4}}>{name||"Expected columns: campaign, product_sku, cohort, channel, audience, sent, ctr, conversion, revenue"}</div>
    </div>
    {err&&<div className="note" style={{color:"var(--bad)",marginTop:12}}>{err}</div>}
    <div className="row" style={{marginTop:12}}>
      <button className="btn ghost" onClick={sample}>Download sample CSV</button>
      {rows&&<button className="btn" onClick={ingest}>Ingest {rows.length} rows</button>}
    </div>
    {rows&&<div className="card" style={{marginTop:16}}><div style={{padding:8}}><table>
      <thead><tr>{Object.keys(rows[0]).map(k=><th key={k}>{k}</th>)}</tr></thead>
      <tbody>{rows.slice(0,12).map((r,i)=><tr key={i}>{Object.keys(rows[0]).map(k=><td key={k}>{r[k]}</td>)}</tr>)}</tbody>
    </table></div></div>}
  </div>;
}

    </div>
    <div className="wrap">
      {status==="error"&&<div className="card pad" style={{marginBottom:18,borderColor:"var(--bad)",background:"var(--bad-soft)"}}>
        <b>Can't reach the sales-api at {API_BASE}.</b> <span className="note">Showing mock data. Start the API (see the sales-api README) or set <code>USE_MOCK=true</code>.</span>
      </div>}
      {tab==="catalog"&&<Catalog/>}
      {tab==="dashboard"&&<div>
        <h1>Dashboard</h1><p className="sub">Sales insights, auto-suggested audience cohorts, and the priority order that drives Strategy.</p>
        <div className="subnav">
          <button className={dash==="sales"?"on":""} onClick={()=>setDash("sales")}>Sales insights</button>
          <button className={dash==="cohorts"?"on":""} onClick={()=>setDash("cohorts")}>Audience cohorts</button>
          <button className={dash==="priorities"?"on":""} onClick={()=>setDash("priorities")}>Priorities</button>
        </div>
        {dash==="sales"&&<SalesInsights period={period}/>}
        {dash==="cohorts"&&<AudienceCohorts/>}
        {dash==="priorities"&&<Priorities period={period}/>}
      </div>}
      {tab==="strategy"&&<Strategy period={period}/>}
      {tab==="calendar"&&<CrmCalendar/>}
      {tab==="assets"&&<Assets extra={uploaded}/>}
      {tab==="upload"&&<Upload onIngest={r=>setUploaded([...uploaded,...r])}/>}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
